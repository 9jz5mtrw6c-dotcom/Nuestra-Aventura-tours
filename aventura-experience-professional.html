/* Shared UI building blocks */
(function () {
  const t = (...a) => NA.i18n.t(...a), L = (o) => NA.i18n.L(o), esc = (s) => NA.u.esc(s), icon = (n, c) => NA.icon(n, c);
  const UI = {};

  UI.dots = (level, max = 3) => `<span class="dots" aria-label="${level}/${max}">${Array.from({ length: max }, (_, i) => `<i class="${i < level ? 'on' : ''}"></i>`).join('')}</span>`;

  UI.tag = (confirmed) => confirmed
    ? `<span class="src src-ok" title="${t('src.site.title')}">${t('src.site')}</span>`
    : `<span class="src src-req" title="${t('src.req.title')}">${t('src.req')}</span>`;

  UI.demoBadge = (text) => `<span class="demo-badge">${icon('info')} ${text || t('demo')}</span>`;

  UI.sectionHead = (eyebrow, title, sub = '', action = '') => `
    <div class="section-head"><div><span class="eyebrow">${eyebrow}</span><h2>${title}</h2>${sub ? `<p class="muted">${sub}</p>` : ''}</div>${action}</div>`;

  UI.empty = (ic, title, text, action = '') => `
    <div class="empty"><div class="empty-ic">${icon(ic)}</div><h3>${title}</h3><p>${text}</p>${action}</div>`;

  UI.isFav = (id) => NA.store.get().profile.favorites.includes(id);
  UI.favBtn = (id) => `<button class="fav-btn ${UI.isFav(id) ? 'on' : ''}" data-fav="${id}" aria-pressed="${UI.isFav(id)}" aria-label="${t('fav.toggle')}">${icon('heart')}</button>`;

  UI.tourCard = (tour, opts = {}) => {
    const f = tour.facts;
    return `<article class="tour-card ${opts.compact ? 'compact' : ''}" style="--accent:${tour.accent}">
      <a class="tour-media" href="#/tour/${tour.id}" aria-label="${esc(L(tour.title))}">
        <img src="${tour.image}" alt="" loading="lazy">
        <span class="tour-icon">${icon(tour.icon)}</span>
      </a>
      ${UI.favBtn(tour.id)}
      <div class="tour-body">
        <span class="eyebrow">${esc(L(tour.kicker))}</span>
        <h3><a href="#/tour/${tour.id}">${esc(L(tour.title))}</a></h3>
        ${opts.compact ? '' : `<p>${esc(L(tour.intro))}</p>`}
        <ul class="meta">
          <li>${icon('gauge')}<span>${UI.dots(f.difficulty.level)}</span></li>
          <li>${icon('clock')}<span>${esc(L(f.duration))}</span></li>
          <li>${icon('ruler')}<span>${esc(L(f.distance))}</span></li>
          <li>${icon('users')}<span>${esc(L(f.suitable))}</span></li>
        </ul>
        ${opts.reason ? `<p class="reason">${icon('sparkles')} ${opts.reason}</p>` : ''}
        <a class="btn btn-ghost" href="#/tour/${tour.id}">${t('discover.more')} ${icon('chevronR')}</a>
      </div>
    </article>`;
  };

  UI.stars = (n, interactive = false, name = 'rating') => interactive
    ? `<div class="stars-input" role="radiogroup" aria-label="${t('mem.rating')}">${[1, 2, 3, 4, 5].map(i => `<button type="button" class="star ${i <= n ? 'on' : ''}" data-star="${i}" role="radio" aria-checked="${i === n}" aria-label="${i}">${icon('star')}</button>`).join('')}<input type="hidden" name="${name}" value="${n}"></div>`
    : `<span class="stars" aria-label="${n}/5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? 'on' : ''}">${icon('star')}</i>`).join('')}</span>`;

  UI.bindStars = (root) => {
    root.querySelectorAll('.stars-input').forEach(g => {
      g.addEventListener('click', e => {
        const b = e.target.closest('[data-star]'); if (!b) return;
        const v = +b.dataset.star;
        g.querySelector('input').value = v;
        g.querySelectorAll('.star').forEach(s => { const on = +s.dataset.star <= v; s.classList.toggle('on', on); s.setAttribute('aria-checked', +s.dataset.star === v); });
      });
    });
  };

  UI.badge = (b, earned, size = '') => `
    <div class="badge ${earned ? 'earned' : 'locked'} ${size}" style="--bc:${b.color}" title="${esc(L(b.how))}">
      <div class="badge-medal"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="bg-${b.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity=".15"/></linearGradient></defs>
        <path d="M50 4l11 8 13-2 6 12 12 6-2 13 8 11-8 11 2 13-12 6-6 12-13-2-11 8-11-8-13 2-6-12-12-6 2-13-8-11 8-11-2-13 12-6 6-12 13 2z" fill="var(--bc)"/>
        <path d="M50 4l11 8 13-2 6 12 12 6-2 13 8 11-8 11 2 13-12 6-6 12-13-2-11 8-11-8-13 2-6-12-12-6 2-13-8-11 8-11-2-13 12-6 6-12 13 2z" fill="url(#bg-${b.id})"/>
        <circle cx="50" cy="50" r="30" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 4"/></svg>
        <span class="badge-ic">${icon(earned ? b.icon : 'lock')}</span></div>
      <b>${esc(L(b.name))}</b><small>${earned ? t('badge.earned') : esc(L(b.how))}</small>
    </div>`;

  // Delegated favourite toggling for any view
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-fav]');
    if (!b) return;
    e.preventDefault();
    const id = b.dataset.fav;
    NA.store.mutate(s => {
      const f = s.profile.favorites; const i = f.indexOf(id);
      if (i >= 0) f.splice(i, 1); else f.push(id);
    }, { silent: true });
    const on = UI.isFav(id);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(x => { x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); });
    NA.u.toast(on ? t('fav.added') : t('fav.removed'));
  });

  NA.ui = UI;
})();

/* ---- js/views/discover.js ---- */
/* DISCOVER – hero, tour categories, tour finder, preparation, tour detail */
(function () {
  const t = (...a) => NA.i18n.t(...a), L = (o) => NA.i18n.L(o), esc = (s) => NA.u.esc(s), icon = (n, c) => NA.icon(n, c);
  NA.views = NA.views || {};

  /* ---------- Tour finder logic ---------- */
  const Q = [
    { id: 'fitness', opts: [['1', 'finder.fit.1'], ['2', 'finder.fit.2'], ['3', 'finder.fit.3']] },
    { id: 'time', opts: [['short', 'finder.time.short'], ['half', 'finder.time.half'], ['full', 'finder.time.full']] },
    { id: 'kids', opts: [['yes', 'finder.kids.yes'], ['no', 'finder.kids.no']] },
    { id: 'interests', multi: true, opts: [['water', 'finder.int.water'], ['mountains', 'finder.int.mountains'], ['culture', 'finder.int.culture'], ['food', 'finder.int.food']] },
    { id: 'mood', opts: [['relaxed', 'finder.mood.relaxed'], ['both', 'finder.mood.both'], ['challenge', 'finder.mood.challenge']] },
    { id: 'group', opts: [['couple', 'finder.group.couple'], ['friends', 'finder.group.friends'], ['family', 'finder.group.family'], ['team', 'finder.group.team']] }
  ];

  function score(ans) {
    return NA.tours.map(tour => {
      const f = tour.finder; let s = 0; const why = [];
      if (f.fitness.includes(+ans.fitness)) { s += 2; why.push(t('finder.why.fitness')); } else s -= 1;
      if (f.time.includes(ans.time)) { s += 2; why.push(t('finder.why.time')); }
      if (ans.kids === 'yes') { if (f.kids) { s += 3; why.push(t('finder.why.kids')); } else s -= 3; }
      const hits = (ans.interests || []).filter(i => f.interests.includes(i));
      if (hits.length) { s += 2 * hits.length; why.push(t('finder.why.interest', { x: hits.map(h => t('finder.int.' + h).toLowerCase()).join(', ') })); }
      if (f.mood.includes(ans.mood)) { s += 2; why.push(t('finder.why.mood')); }
      if (ans.group === 'team' && f.group === 'team') { s += 4; why.push(t('finder.why.team')); }
      if (ans.group === 'family' && f.kids) s += 2;
      if (ans.group !== 'team' && f.group === 'team') s -= 2;
      return { tour, s, why };
    }).sort((a, b) => b.s - a.s);
  }

  function finderSummary(ans) {
    const parts = [];
    Q.forEach(q => {
      const v = ans[q.id]; if (!v || (Array.isArray(v) && !v.length)) return;
      const vals = (Array.isArray(v) ? v : [v]).map(x => t(q.opts.find(o => o[0] === x)[1]));
      parts.push(`${t('finder.q.' + q.id)} ${vals.join(', ')}`);
    });
    return parts.join('\n');
  }

  function renderFinder(root) {
    const box = root.querySelector('#finder');
    let step = 0; const ans = { interests: [] };
    const draw = () => {
      if (step >= Q.length) return drawResult();
      const q = Q[step];
      box.innerHTML = `
        <div class="finder-top"><span class="eyebrow">${t('finder.step', { n: step + 1, total: Q.length })}</span>
          <div class="progress"><i style="width:${(step / Q.length) * 100}%"></i></div></div>
        <h3 class="finder-q">${t('finder.q.' + q.id)}</h3>
        ${q.multi ? `<p class="muted small">${t('finder.multi')}</p>` : ''}
        <div class="choice-grid">${q.opts.map(([v, k]) => {
          const on = q.multi ? ans[q.id].includes(v) : ans[q.id] === v;
          return `<button class="choice ${on ? 'on' : ''}" data-v="${v}" aria-pressed="${on}">${t(k)}</button>`;
        }).join('')}</div>
        <div class="row between mt">
          <button class="btn btn-text" data-back ${step === 0 ? 'disabled' : ''}>${icon('chevronL')} ${t('back')}</button>
          ${q.multi ? `<button class="btn btn-primary" data-next>${t('next')} ${icon('chevronR')}</button>` : ''}
        </div>`;
      box.querySelectorAll('.choice').forEach(b => b.onclick = () => {
        const v = b.dataset.v;
        if (q.multi) {
          const a = ans[q.id]; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v);
          b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on'));
        } else { ans[q.id] = v; step++; setTimeout(draw, 160); b.classList.add('on'); }
      });
      const nb = box.querySelector('[data-next]'); if (nb) nb.onclick = () => { step++; draw(); };
      box.querySelector('[data-back]').onclick = () => { if (step > 0) { step--; draw(); } };
    };
    const drawResult = () => {
      const res = score(ans);
      const top = res.slice(0, 2);
      const summary = finderSummary(ans);
      box.innerHTML = `
        <div class="finder-top"><span class="eyebrow">${t('finder.result')}</span><div class="progress"><i style="width:100%"></i></div></div>
        <h3 class="finder-q">${t('finder.resultTitle')}</h3>
        <div class="finder-results">${top.map((r, i) => `
          <a class="finder-hit ${i === 0 ? 'best' : ''}" href="#/tour/${r.tour.id}">
            <img src="${r.tour.image}" alt="">
            <div><span class="eyebrow">${i === 0 ? t('finder.best') : t('finder.alt')}</span><b>${esc(L(r.tour.title))}</b>
            <small>${r.why.slice(0, 3).join(' · ') || esc(L(r.tour.kicker))}</small></div>${icon('chevronR')}</a>`).join('')}
        </div>
        <p class="muted small mt">${t('finder.note')}</p>
        <div class="row gap-s wrap mt">
          <a class="btn btn-wa" target="_blank" rel="noopener" href="${NA.contact.link('custom', t('finder.waIntro') + '\n' + summary + '\n→ ' + L(top[0].tour.title))}">${icon('whatsapp')} ${t('finder.ask')}</a>
          <button class="btn btn-text" data-restart>${t('finder.restart')}</button>
        </div>`;
      box.querySelector('[data-restart]').onclick = () => { step = 0; Object.keys(ans).forEach(k => delete ans[k]); ans.interests = []; draw(); };
    };
    draw();
  }

  /* ---------- Preparation checklist (from the blog "Wat neem je mee") ---------- */
  const PACK = ['water', 'shoes', 'sun', 'food', 'nav', 'swim'];

  function renderPrep(root) {
    const box = root.querySelector('#prep');
    const draw = () => {
      const prep = NA.store.get().prep || {};
      const done = PACK.filter(k => prep[k]).length;
      box.innerHTML = `
        <div class="prep-ring" style="--p:${done / PACK.length}"><span>${done}/${PACK.length}</span></div>
        <ul class="checklist">${PACK.map(k => `<li><label class="check ${prep[k] ? 'on' : ''}"><input type="checkbox" data-k="${k}" ${prep[k] ? 'checked' : ''}>
          <span class="box">${icon('check')}</span><span><b>${t('prep.' + k)}</b><small>${t('prep.' + k + '.sub')}</small></span></label></li>`).join('')}</ul>
        <div class="row between wrap gap-s mt"><a class="btn btn-text" href="${NA.brand.pages.packing}" target="_blank" rel="noopener">${t('prep.source')} ${icon('chevronR')}</a>
        ${done ? `<button class="btn btn-text" data-reset>${t('prep.reset')}</button>` : ''}</div>`;
      box.querySelectorAll('input[data-k]').forEach(i => i.onchange = () => {
        NA.store.mutate(s => { s.prep = s.prep || {}; s.prep[i.dataset.k] = i.checked; }, { silent: true });
        draw();
        if (PACK.every(k => (NA.store.get().prep || {})[k])) NA.u.toast(t('prep.ready'), 'success');
      });
      const r = box.querySelector('[data-reset]'); if (r) r.onclick = () => { NA.store.mutate(s => { s.prep = {}; }, { silent: true }); draw(); };
    };
    draw();
  }

  NA.views.discover = {
    title: () => t('nav.discover'),
    render() {
      const st = NA.store.get();
      const name = st.profile.name;
      const placesPreview = NA.places.slice(0, 4);
      return `
      <section class="hero">
        <img class="hero-img" src="${NA.photos.reservoir}" alt="">
        <div class="hero-shade"></div>
        <div class="hero-inner">
          <span class="hero-kicker">${icon('compass')} ${name ? t('hero.hi', { name: esc(name) }) : 'Nuestra Aventura · Valencia'}</span>
          <h1>Discover more.<br>Explore further.<br><em>Remember forever.</em></h1>
          <p>${t('hero.lead')}</p>
          <div class="row gap-s wrap">
            <a class="btn btn-sand" href="#finder-anchor" data-scroll="finder-anchor">${icon('sparkles')} ${t('hero.cta')}</a>
            <a class="btn btn-glass" href="#/play">${icon('puzzle')} ${t('hero.play')}</a>
          </div>
        </div>
      </section>

      <section class="wrap section">
        ${UIhead(t('discover.eyebrow'), t('discover.title'), L(NA.toursGeneral))}
        <div class="tour-grid">${NA.tours.map(x => NA.ui.tourCard(x)).join('')}</div>
      </section>

      <section class="wrap section" id="finder-anchor">
        <div class="split">
          <div class="split-text">
            ${UIhead(t('finder.eyebrow'), t('finder.title'), t('finder.sub'))}
            <ul class="ticks"><li>${icon('check')} ${t('finder.tick1')}</li><li>${icon('check')} ${t('finder.tick2')}</li><li>${icon('check')} ${t('finder.tick3')}</li></ul>
          </div>
          <div class="card finder" id="finder"></div>
        </div>
      </section>

      <section class="wrap section">
        <a class="feature-band" href="#/play">
          <img src="${NA.photos.hiker}" alt="">
          <div><span class="eyebrow light">${t('play.eyebrow')}</span><h2>The Secret of Valencia</h2><p>${t('discover.gameTeaser')}</p>
          <span class="btn btn-sand">${icon('play')} ${t('hero.play')}</span></div>
        </a>
      </section>

      <section class="wrap section">
        ${UIhead(t('hidden.eyebrow'), t('hidden.title'), t('hidden.sub'), `<a class="btn btn-text" href="#/hidden">${t('seeAll')} ${icon('chevronR')}</a>`)}
        <div class="h-scroll">${placesPreview.map(p => `
          <a class="place-mini" href="#/hidden/${p.id}"><img src="${p.image}" alt="" loading="lazy"><span class="place-type">${t('ptype.' + p.type)}</span><b>${esc(L(p.title))}</b></a>`).join('')}</div>
      </section>

      <section class="wrap section">
        <div class="split">
          <div class="split-text">${UIhead(t('prep.eyebrow'), t('prep.title'), t('prep.sub'))}</div>
          <div class="card prep" id="prep"></div>
        </div>
      </section>

      ${NA.views.contactBand()}`;
    },
    mount(root) {
      renderFinder(root);
      renderPrep(root);
      root.querySelectorAll('[data-scroll]').forEach(a => a.onclick = (e) => { e.preventDefault(); document.getElementById(a.dataset.scroll).scrollIntoView({ behavior: 'smooth' }); });
    }
  };
  const UIhead = (...a) => NA.ui.sectionHead(...a);

  /* ---------- Tour detail ---------- */
  NA.views.tour = {
    title: (p) => { const x = NA.tours.find(t => t.id === p.id); return x ? L(x.title) : ''; },
    render(p) {
      const tour = NA.tours.find(x => x.id === p.id);
      if (!tour) return NA.views.notFound();
      const f = tour.facts;
      const routes = NA.routes.filter(r => r.tour === tour.id);
      const places = NA.places.filter(pl => pl.tour === tour.id);
      const fact = (ic, label, v) => `<div class="fact">${icon(ic)}<div><small>${label}</small><b>${esc(L(v))}</b>${NA.ui.tag(v.confirmed)}</div></div>`;
      const inc = tour.included ? L(tour.included) : null;
      return `
      <section class="detail-hero" style="--accent:${tour.accent}">
        <img src="${tour.image}" alt="">
        <div class="hero-shade"></div>
        <a class="back-btn" href="#/discover" aria-label="${t('back')}">${icon('chevronL')}</a>
        ${NA.ui.favBtn(tour.id)}
        <div class="detail-hero-inner wrap"><span class="eyebrow light">${esc(L(tour.kicker))}</span><h1>${esc(L(tour.title))}</h1></div>
      </section>
      <section class="wrap section detail">
        <p class="lead">${esc(L(tour.intro))}</p>
        <div class="facts">
          <div class="fact">${icon('gauge')}<div><small>${t('fact.difficulty')}</small><b>${NA.ui.dots(f.difficulty.level)} ${esc(L(f.difficulty))}</b>${NA.ui.tag(f.difficulty.confirmed)}</div></div>
          ${fact('clock', t('fact.duration'), f.duration)}
          ${fact('ruler', t('fact.distance'), f.distance)}
          ${fact('users', t('fact.suitable'), f.suitable)}
          ${fact('gift', t('fact.price'), f.price)}
        </div>
        ${inc ? `<div class="card soft"><h3>${t('fact.included')}</h3><ul class="ticks">${inc.map(i => `<li>${icon('check')} ${esc(i)}</li>`).join('')}</ul></div>` : ''}
        <div class="card soft"><p>${icon('info')} ${esc(L(NA.toursGeneral))}</p></div>

        <div class="cta-stack">
          <a class="btn btn-wa btn-lg" target="_blank" rel="noopener" href="${NA.contact.link('info', '→ ' + L(tour.title))}">${icon('whatsapp')} ${t('tour.ask')}</a>
          <button class="btn btn-ghost" data-log>${icon('passport')} ${t('tour.log')}</button>
          <a class="btn btn-text" href="${tour.url}" target="_blank" rel="noopener">${t('tour.website')} ${icon('chevronR')}</a>
        </div>

        ${routes.length ? `${NA.ui.sectionHead(t('nav.explore'), t('tour.routes'))}<div class="list">${routes.map(r => NA.views.routeRow(r)).join('')}</div>` : ''}
        ${places.length ? `${NA.ui.sectionHead(t('hidden.eyebrow'), t('tour.places'))}<div class="h-scroll">${places.map(pl => `
          <a class="place-mini" href="#/hidden/${pl.id}"><img src="${pl.image}" alt="" loading="lazy"><span class="place-type">${t('ptype.' + pl.type)}</span><b>${esc(L(pl.title))}</b></a>`).join('')}</div>` : ''}
      </section>`;
    },
    mount(root, p) {
      const tour = NA.tours.find(x => x.id === p.id); if (!tour) return;
      const b = root.querySelector('[data-log]');
      if (b) b.onclick = () => NA.views.logTourSheet(tour.id);
    }
  };

  /* Sheet: log a real Nuestra Aventura tour in the passport */
  NA.views.logTourSheet = (preset) => {
    const today = new Date().toISOString().slice(0, 10);
    const sh = NA.u.sheet(`
      <div class="sheet-head"><span class="eyebrow">${t('nav.passport')}</span><h2>${t('log.title')}</h2><p class="muted">${t('log.sub')}</p></div>
      <form class="form" id="logForm">
        <label>${t('log.tour')}<select name="tour" required>${NA.tours.map(x => `<option value="${x.id}" ${x.id === preset ? 'selected' : ''}>${esc(L(x.title))}</option>`).join('')}</select></label>
        <label>${t('log.date')}<input type="date" name="date" value="${today}" max="${today}" required></label>
        <div class="row gap-s"><label class="grow">${t('log.km')}<input type="number" name="km" min="0" max="100" step="0.1" inputmode="decimal" placeholder="—"></label>
        <label class="grow">${t('log.gain')}<input type="number" name="gain" min="0" max="5000" step="10" inputmode="numeric" placeholder="—"></label></div>
        <label>${t('log.place')}<select name="place"><option value="">—</option>${NA.places.map(pl => `<option value="${pl.id}">${esc(L(pl.title))}</option>`).join('')}</select></label>
        <button class="btn btn-primary btn-lg" type="submit">${icon('check')} ${t('log.save')}</button>
      </form>`);
    sh.querySelector('#logForm').onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const tour = NA.tours.find(x => x.id === fd.get('tour'));
      const date = new Date(fd.get('date') + 'T12:00:00').toISOString();
      NA.store.mutate(s => {
        s.adventures.unshift({ id: NA.u.uid(), kind: 'tour', refId: tour.id, tourType: tour.id, title: tour.title, date,
          km: parseFloat(fd.get('km')) || 0, gain: parseInt(fd.get('gain')) || 0, source: 'manual' });
        const pl = fd.get('place');
        if (pl && !s.visits[pl]) s.visits[pl] = { date, verified: false };
      });
      NA.u.closeSheet();
      NA.u.toast(t('log.saved'), 'success');
      if (location.hash.startsWith('#/passport')) NA.app.render();
    };
  };
})();

/* ---- js/views/explore.js ---- */
/* EXPLORE – interactive hiking maps (Leaflet + OSM), GPS progress, GPX import */
(function () {
  const t = (...a) => NA.i18n.t(...a), L = (o) => NA.i18n.L(o), esc = (s) => NA.u.esc(s), icon = (n, c) => NA.icon(n, c);

  const allRoutes = () => NA.routes.concat((NA.store.get().importedRoutes || []).map(r => Object.assign({ imported: true }, r)));
  const findRoute = (id) => allRoutes().find(r => r.id === id);
  const rTitle = (r) => r.imported ? r.name : L(r.title);

  NA.views.routeRow = (r) => {
    const s = NA.u.routeStats(r.track);
    const done = NA.store.get().adventures.some(a => a.kind === 'route' && a.refId === r.id);
    return `<a class="route-row" href="#/route/${r.id}">
      <img src="${r.image || NA_ASSET['assets/img/hills.svg']}" alt="" loading="lazy">
      <div class="grow"><div class="row gap-s wrap">${r.demo ? NA.ui.demoBadge(t('demo.route')) : ''}${r.imported ? `<span class="demo-badge gpx">GPX</span>` : ''}${done ? `<span class="done-badge">${icon('check')} ${t('done')}</span>` : ''}</div>
      <b>${esc(rTitle(r))}</b>
      <small>${icon('ruler')} ${NA.u.fmtKm(s.dist)} · ${icon('trend')} ${s.hasEle ? s.gain + ' m' : '—'} · ${icon('clock')} ${NA.u.fmtHours(s.hours)}</small></div>${icon('chevronR')}</a>`;
  };

  /* ---------------- Route list ---------------- */
  NA.views.explore = {
    title: () => t('nav.explore'),
    render() {
      const imported = NA.store.get().importedRoutes || [];
      return `
      <section class="page-hero small"><img src="${NA.photos.hiker}" alt=""><div class="hero-shade"></div>
        <div class="wrap page-hero-inner"><span class="eyebrow light">${t('explore.eyebrow')}</span><h1>${t('explore.title')}</h1><p>${t('explore.sub')}</p></div></section>
      <section class="wrap section">
        <div class="notice">${icon('info')}<div><b>${t('explore.demoTitle')}</b><p>${t('explore.demoText')}</p></div></div>
        <div class="card map-card"><div id="overview-map" class="map map-md"></div></div>
        ${NA.ui.sectionHead(t('explore.routes'), t('explore.routesTitle'))}
        <div class="list">${NA.routes.map(NA.views.routeRow).join('')}</div>

        ${NA.ui.sectionHead('GPX', t('gpx.title'), t('gpx.sub'))}
        <label class="dropzone" id="gpxDrop">
          <input type="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" id="gpxInput" hidden>
          ${icon('upload')}<b>${t('gpx.choose')}</b><small>${t('gpx.hint')}</small>
        </label>
        ${imported.length ? `<div class="list mt">${imported.map(r => NA.views.routeRow(Object.assign({ imported: true }, r))).join('')}</div>` : ''}
        <a class="feature-link" href="#/hidden">${icon('pin')} <span><b>${t('hidden.title')}</b><small>${t('explore.hiddenLink')}</small></span>${icon('chevronR')}</a>
      </section>`;
    },
    mount(root) {
      // overview map with all routes
      const el = root.querySelector('#overview-map');
      const map = NA.map.create(el);
      if (map) {
        const group = window.L.featureGroup().addTo(map);
        allRoutes().forEach(r => {
          const line = window.L.polyline(r.track.map(p => [p[0], p[1]]), { color: r.demo ? '#2BA8A4' : '#D9774B', weight: 4, dashArray: r.demo ? '8 8' : null }).addTo(group);
          line.bindTooltip(esc(rTitle(r)) + (r.demo ? ' (demo)' : ''));
          line.on('click', () => location.hash = '#/route/' + r.id);
          window.L.marker(r.track[0], { icon: NA.map.divIcon('mk-start', icon('flag'), 30) }).addTo(group).on('click', () => location.hash = '#/route/' + r.id);
        });
        map.fitBounds(group.getBounds(), { padding: [30, 30] });
      }
      // GPX import
      const input = root.querySelector('#gpxInput'), drop = root.querySelector('#gpxDrop');
      const handle = (file) => {
        if (!file) return;
        if (file.size > 8 * 1024 * 1024) return NA.u.toast(t('gpx.tooBig'), 'error');
        const r = new FileReader();
        r.onload = () => {
          try {
            const g = NA.map.parseGPX(r.result);
            const id = 'gpx-' + NA.u.uid();
            const ok = NA.store.mutate(s => { s.importedRoutes = s.importedRoutes || []; s.importedRoutes.push({ id, name: g.name || file.name.replace(/\.gpx$/i, ''), track: g.track, wpts: g.wpts, importedAt: new Date().toISOString() }); });
            if (ok) { NA.u.toast(t('gpx.ok'), 'success'); location.hash = '#/route/' + id; }
            else NA.store.mutate(s => { s.importedRoutes = s.importedRoutes.filter(x => x.id !== id); }, { silent: true });
          } catch (e) { NA.u.toast(t(e.message === 'gpx-empty' ? 'gpx.empty' : 'gpx.invalid'), 'error', 5000); }
        };
        r.onerror = () => NA.u.toast(t('gpx.invalid'), 'error');
        r.readAsText(file);
      };
      input.onchange = () => handle(input.files[0]);
      ['dragover', 'dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => handle(e.dataTransfer.files[0]));
      return () => map && map.remove();
    }
  };

  /* ---------------- Route detail ---------------- */
  NA.views.route = {
    title: (p) => { const r = findRoute(p.id); return r ? rTitle(r) : ''; },
    render(p) {
      const r = findRoute(p.id);
      if (!r) return NA.views.notFound();
      const s = NA.u.routeStats(r.track);
      const pois = r.pois || (r.wpts || []).map(w => ({ pos: w.pos, title: w.name, text: w.desc, type: 'poi' }));
      const start = r.track[0], end = r.track[r.track.length - 1];
      return `
      <section class="route-top">
        <div id="route-map" class="map map-lg"></div>
        <a class="back-btn" href="#/explore" aria-label="${t('back')}">${icon('chevronL')}</a>
        ${r.demo ? `<div class="map-banner">${icon('info')} ${t('route.demoBanner')}</div>` : ''}
        <div class="map-fabs">
          <button class="fab-round" data-locate aria-label="${t('gps.locate')}" title="${t('gps.locate')}">${icon('locate')}</button>
        </div>
      </section>
      <section class="wrap section route-detail">
        <div class="row gap-s wrap">${r.demo ? NA.ui.demoBadge(t('demo.route')) : ''}${r.imported ? `<span class="demo-badge gpx">GPX · ${t('gpx.own')}</span>` : ''}${r.region ? `<span class="chip static">${icon('pin')} ${esc(r.region)}</span>` : ''}</div>
        <h1 class="route-title">${esc(rTitle(r))}</h1>
        ${r.intro ? `<p class="lead">${esc(L(r.intro))}</p>` : ''}
        <div class="stat-row">
          <div class="stat">${icon('ruler')}<b>${NA.u.fmtKm(s.dist)}</b><small>${t('route.distance')}</small></div>
          <div class="stat">${icon('trend')}<b>${s.hasEle ? s.gain + ' m' : '—'}</b><small>${t('route.gain')}</small></div>
          <div class="stat">${icon('clock')}<b>${NA.u.fmtHours(s.hours)}</b><small>${t('route.time')}</small></div>
          <div class="stat">${icon('mountain')}<b>${s.hasEle ? s.maxEle + ' m' : '—'}</b><small>${t('route.highest')}</small></div>
        </div>
        <p class="fine">${t('route.timeNote')}${r.demo ? ' · ' + t('route.demoStats') : ''}</p>

        <div class="card walk-card">
          <div class="row between"><h3>${t('walk.title')}</h3><span class="walk-state" id="walkState">${t('walk.idle')}</span></div>
          <div class="progress big"><i id="walkBar" style="width:0%"></i></div>
          <div class="row between small muted"><span id="walkDone">0,0 km</span><span id="walkLeft">${NA.u.fmtKm(s.dist)}</span></div>
          <div id="profile">${NA.map.profileSVG(r.track, s, 0)}</div>
          <div class="walk-btns">
            <button class="btn btn-primary" data-start>${icon('nav')} ${t('walk.start')}</button>
            <button class="btn btn-ghost" data-sim>${icon('play')} ${t('walk.sim')}</button>
            <button class="btn btn-text" data-manual>${icon('check')} ${t('walk.manual')}</button>
          </div>
          <p class="fine" id="gpsMsg">${t('walk.gpsNote')}</p>
        </div>

        ${pois.length ? `${NA.ui.sectionHead(t('route.poisEyebrow'), t('route.pois'))}
        <div class="poi-list">${pois.map((pt, i) => `
          <button class="poi" data-poi="${i}">
            ${pt.image ? `<img src="${pt.image}" alt="" loading="lazy">` : `<span class="poi-ic">${icon('pin')}</span>`}
            <span class="grow"><small class="eyebrow">${pt.type === 'start' ? t('route.start') : pt.type === 'end' ? t('route.end') : t('route.poi') + ' ' + i}</small>
            <b>${esc(L(pt.title))}</b><small>${esc(L(pt.text))}</small></span></button>`).join('')}</div>` : ''}

        ${NA.ui.sectionHead(t('route.navEyebrow'), t('route.nav'), t('route.navSub'))}
        <div class="row gap-s wrap">
          <a class="btn btn-ghost" target="_blank" rel="noopener" href="${NA.map.googleUrl(start[0], start[1])}">${icon('nav')} Google Maps</a>
          <a class="btn btn-ghost" target="_blank" rel="noopener" href="${NA.map.appleUrl(start[0], start[1], rTitle(r))}">${icon('nav')} Apple Maps</a>
          <button class="btn btn-ghost" data-gpx>${icon('download')} ${t('route.gpx')}</button>
        </div>
        ${r.demo ? `<p class="fine">${t('route.navDemo')}</p>` : ''}

        <div class="card soft mt">
          <div class="row gap wrap between"><div><b>${t('route.question')}</b><p class="muted small">${t('route.questionSub')}</p></div>
          <a class="btn btn-wa" target="_blank" rel="noopener" href="${NA.contact.link('route', '→ ' + rTitle(r))}">${icon('whatsapp')} WhatsApp</a></div>
        </div>
        ${r.source ? `<p class="fine mt"><a href="${r.source}" target="_blank" rel="noopener">${t('route.source')} ${icon('chevronR')}</a></p>` : ''}
        ${r.imported ? `<button class="btn btn-text danger mt" data-del>${icon('trash')} ${t('gpx.delete')}</button>` : ''}
      </section>`;
    },
    mount(root, p) {
      const r = findRoute(p.id); if (!r) return;
      const s = NA.u.routeStats(r.track);
      const pois = r.pois || (r.wpts || []).map(w => ({ pos: w.pos, title: w.name, text: w.desc, type: 'poi' }));
      const latlngs = r.track.map(x => [x[0], x[1]]);
      const map = NA.map.create(root.querySelector('#route-map'), { scrollWheel: true });
      let walked, me, meCircle, poiMarkers = [];
      if (map) {
        window.L.polyline(latlngs, { color: '#fff', weight: 9, opacity: .9 }).addTo(map);
        const line = window.L.polyline(latlngs, { color: '#1F4D3A', weight: 5, dashArray: r.demo ? '10 8' : null }).addTo(map);
        walked = window.L.polyline([], { color: '#D9774B', weight: 6 }).addTo(map);
        window.L.marker(latlngs[0], { icon: NA.map.divIcon('mk-start', icon('flag'), 34), title: t('route.start') }).addTo(map);
        const endSame = NA.u.haversine(r.track[0], r.track[r.track.length - 1]) < 30;
        if (!endSame) window.L.marker(latlngs[latlngs.length - 1], { icon: NA.map.divIcon('mk-end', icon('trophy'), 34), title: t('route.end') }).addTo(map);
        pois.forEach((pt, i) => {
          if (pt.type === 'start' || (pt.type === 'end' && endSame)) { poiMarkers[i] = null; return; }
          const pos = pt.pos || latlngs[Math.min(pt.at, latlngs.length - 1)];
          const m = window.L.marker(pos, { icon: NA.map.divIcon('mk-poi', `<span>${i}</span>`, 30) }).addTo(map);
          m.bindPopup(`<div class="pop">${pt.image ? `<img src="${pt.image}" alt="">` : ''}<b>${esc(L(pt.title))}</b><p>${esc(L(pt.text))}</p>${r.demo ? `<small>${t('route.poiDemo')}</small>` : ''}</div>`, { maxWidth: 240 });
          poiMarkers[i] = m;
        });
        map.fitBounds(line.getBounds(), { padding: [30, 30] });
      }
      root.querySelectorAll('[data-poi]').forEach(b => b.onclick = () => {
        const m = poiMarkers[+b.dataset.poi];
        if (m && map) { root.querySelector('#route-map').scrollIntoView({ behavior: 'smooth', block: 'center' }); map.setView(m.getLatLng(), 15); m.openPopup(); }
      });

      /* --- walking progress --- */
      let maxIdx = 0, stopWatch = null, simTimer = null, mode = null, finished = false;
      const bar = root.querySelector('#walkBar'), stEl = root.querySelector('#walkState'), msg = root.querySelector('#gpsMsg');
      const startBtn = root.querySelector('[data-start]'), simBtn = root.querySelector('[data-sim]');
      const update = () => {
        const done = s.cum[maxIdx] || 0, frac = s.dist ? done / s.dist : 0;
        bar.style.width = (frac * 100).toFixed(1) + '%';
        root.querySelector('#walkDone').textContent = NA.u.fmtKm(done);
        root.querySelector('#walkLeft').textContent = t('walk.left', { x: NA.u.fmtKm(Math.max(0, s.dist - done)) });
        root.querySelector('#profile').innerHTML = NA.map.profileSVG(r.track, s, frac);
        if (walked) walked.setLatLngs(latlngs.slice(0, maxIdx + 1));
        if (maxIdx >= r.track.length - 1 && !finished) finish();
      };
      const setMe = (lat, lng, acc) => {
        if (!map) return;
        if (!me) { me = window.L.marker([lat, lng], { icon: NA.map.divIcon('mk-me', '', 22), zIndexOffset: 1000 }).addTo(map); meCircle = window.L.circle([lat, lng], { radius: acc || 10, color: '#2BA8A4', weight: 1, fillOpacity: .12 }).addTo(map); }
        else { me.setLatLng([lat, lng]); meCircle.setLatLng([lat, lng]).setRadius(acc || 10); }
      };
      const stopAll = () => {
        if (stopWatch) { stopWatch(); stopWatch = null; }
        if (simTimer) { clearInterval(simTimer); simTimer = null; }
        mode = null;
        startBtn.innerHTML = `${icon('nav')} ${t('walk.start')}`;
        simBtn.innerHTML = `${icon('play')} ${t('walk.sim')}`;
      };
      const finish = () => {
        finished = true;
        const wasMode = mode;
        stopAll();
        stEl.textContent = t('walk.finished');
        NA.u.confetti();
        const source = wasMode === 'gps' ? 'gps' : 'demo';
        NA.store.addAdventure({ kind: 'route', refId: r.id, title: r.imported ? r.name : r.title, tourType: r.tour || null, km: +(s.dist / 1000).toFixed(1), gain: s.gain, source });
        NA.u.sheet(`<div class="celebrate">${icon('trophy')}<h2>${t('walk.doneTitle')}</h2>
          <p>${source === 'demo' ? t('walk.doneDemo') : t('walk.doneText', { km: NA.u.fmtKm(s.dist) })}</p>
          <div class="cta-stack"><a class="btn btn-primary" href="#/memories/new?tour=${r.tour || ''}" data-close>${icon('camera')} ${t('walk.addMemory')}</a>
          <a class="btn btn-ghost" href="#/passport" data-close>${icon('passport')} ${t('walk.toPassport')}</a></div></div>`);
      };

      // Real GPS walk – progress only counts when you are near the track
      startBtn.onclick = () => {
        if (mode === 'gps') { stopAll(); stEl.textContent = t('walk.paused'); return; }
        stopAll();
        if (!NA.map.gpsSupported() || !window.isSecureContext) { msg.textContent = NA.map.gpsErrorText(null); msg.classList.add('warn'); return; }
        mode = 'gps'; finished = false;
        stEl.textContent = t('gps.asking');
        startBtn.innerHTML = `${icon('pause')} ${t('walk.pause')}`;
        let first = true;
        stopWatch = NA.map.watch(pos => {
          setMe(pos.lat, pos.lng, pos.acc);
          if (first && map) { map.setView([pos.lat, pos.lng], 15); first = false; }
          const n = NA.u.nearestIndex(r.track, [pos.lat, pos.lng]);
          const tol = Math.max(60, Math.min(pos.acc || 0, 150));
          if (n.distance <= tol) {
            // only move forward, and never jump more than ~600 m at once
            if (n.index > maxIdx && (s.cum[n.index] - s.cum[maxIdx]) < 600) maxIdx = n.index;
            stEl.textContent = t('walk.onTrack');
            msg.classList.remove('warn');
            msg.textContent = t('gps.active', { acc: Math.round(pos.acc) });
          } else {
            stEl.textContent = t('walk.offTrack');
            msg.classList.add('warn');
            msg.textContent = t('walk.offTrackText', { d: n.distance > 2000 ? NA.u.fmtKm(n.distance) : Math.round(n.distance) + ' m' });
          }
          update();
        }, err => { stopAll(); stEl.textContent = t('walk.idle'); msg.textContent = NA.map.gpsErrorText(err); msg.classList.add('warn'); });
      };

      // Simulation – clearly labelled demo, moves a marker along the track
      simBtn.onclick = () => {
        if (mode === 'sim') { stopAll(); stEl.textContent = t('walk.paused'); return; }
        stopAll();
        if (maxIdx >= r.track.length - 1) { maxIdx = 0; finished = false; }
        mode = 'sim';
        stEl.textContent = t('walk.simActive');
        simBtn.innerHTML = `${icon('pause')} ${t('walk.pause')}`;
        const stepN = Math.max(1, Math.round(r.track.length / 60));
        simTimer = setInterval(() => {
          maxIdx = Math.min(r.track.length - 1, maxIdx + stepN);
          const pt = r.track[maxIdx]; setMe(pt[0], pt[1], 8);
          update();
        }, 220);
      };

      root.querySelector('[data-manual]').onclick = () => {
        NA.u.sheet(`<div class="sheet-head"><h2>${t('walk.manualTitle')}</h2><p class="muted">${t('walk.manualText', { km: NA.u.fmtKm(s.dist) })}</p></div>
          <div class="cta-stack"><button class="btn btn-primary" data-yes>${icon('check')} ${t('walk.manualYes')}</button><button class="btn btn-text" data-close>${t('cancel')}</button></div>`)
          .querySelector('[data-yes]').onclick = () => {
            NA.store.addAdventure({ kind: 'route', refId: r.id, title: r.imported ? r.name : r.title, tourType: r.tour || null, km: +(s.dist / 1000).toFixed(1), gain: s.gain, source: r.demo ? 'demo' : 'manual' });
            NA.u.closeSheet(); NA.u.toast(t('log.saved'), 'success');
          };
      };

      // "Where am I" button
      let locStop = null;
      root.querySelector('[data-locate]').onclick = () => {
        if (!NA.map.gpsSupported() || !window.isSecureContext) return NA.u.toast(NA.map.gpsErrorText(null), 'error', 5000);
        NA.u.toast(t('gps.asking'));
        locStop && locStop();
        locStop = NA.map.watch(pos => {
          setMe(pos.lat, pos.lng, pos.acc);
          map && map.setView([pos.lat, pos.lng], 15);
          const n = NA.u.nearestIndex(r.track, [pos.lat, pos.lng]);
          NA.u.toast(t('gps.distToRoute', { d: n.distance > 1000 ? NA.u.fmtKm(n.distance) : Math.round(n.distance) + ' m' }));
          locStop(); locStop = null;
        }, err => { NA.u.toast(NA.map.gpsErrorText(err), 'error', 5000); locStop && locStop(); locStop = null; });
      };

      root.querySelector('[data-gpx]').onclick = () => {
        const name = rTitle(r) + (r.demo ? ' (DEMO – not verified)' : '');
        NA.u.download((r.id || 'route') + '.gpx', NA.map.toGPX(name, r.track));
      };
      const del = root.querySelector('[data-del]');
      if (del) del.onclick = () => {
        if (!confirmSheet()) return;
      };
      function confirmSheet() {
        NA.u.sheet(`<div class="sheet-head"><h2>${t('gpx.delete')}?</h2><p class="muted">${esc(rTitle(r))}</p></div>
          <div class="cta-stack"><button class="btn btn-danger" data-yes>${icon('trash')} ${t('delete')}</button><button class="btn btn-text" data-close>${t('cancel')}</button></div>`)
          .querySelector('[data-yes]').onclick = () => {
            NA.store.mutate(s2 => { s2.importedRoutes = s2.importedRoutes.filter(x => x.id !== r.id); });
            NA.u.closeSheet(); location.hash = '#/explore';
          };
        return false;
      }
      return () => { stopAll(); locStop && locStop(); map && map.remove(); };
    }
  };
})();

/* ---- js/views/hidden.js ---- */
/* HIDDEN VALENCIA – special places map + discovery cards + check-ins */
(function () {
  const t = (...a) => NA.i18n.t(...a), L = (o) => NA.i18n.L(o), esc = (s) => NA.u.esc(s), icon = (n, c) => NA.icon(n, c);
  const typeIcon = { gorge: 'canyon', waterfall: 'droplet', river: 'wind', mountain: 'mountain', viewpoint: 'eye', hills: 'layers', spring: 'droplet', food: 'utensils' };
  const accessTxt = (lvl) => t('access.' + lvl);

  function openPlace(p) {
    const v = NA.store.get().visits[p.id];
    const tour = p.tour && NA.tours.find(x => x.id === p.tour);
    const sh = NA.u.sheet(`
      <img class="sheet-img" src="${p.image}" alt="">
      <div class="sheet-head"><span class="eyebrow">${icon(typeIcon[p.type])} ${t('ptype.' + p.type)}</span><h2>${esc(L(p.title))}</h2></div>
      <p>${esc(L(p.text))}</p>
      <div class="facts two">
        <div class="fact">${icon('nav')}<div><small>${t('place.access')}</small><b>${esc(L(p.access))}</b><span class="access-meter">${NA.ui.dots(4 - p.access.level)} ${accessTxt(p.access.level)}</span></div></div>
        <div class="fact">${icon('bulb')}<div><small>${t('place.fact')}</small><b>${esc(L(p.fact))}</b></div></div>
      </div>
      ${p.pos ? `<p class="fine">${icon('info')} ${t('place.approx')}</p>` : `<p class="fine">${icon('lock')} ${t('place.secret')}</p>`}
      <div class="cta-stack">
        ${v ? `<div class="stamp-inline">${icon('check')} ${t('place.visited', { date: NA.u.fmtDate(v.date) })}${v.verified ? ' · GPS' : ''}</div>`
          : `<button class="btn btn-primary" data-checkin>${icon('passport')} ${t('place.checkin')}</button>`}
        ${tour ? `<a class="btn btn-ghost" href="#/tour/${tour.id}" data-close>${icon(tour.icon)} ${t('place.tour', { tour: esc(L(tour.title)) })}</a>` : ''}
        ${p.route ? `<a class="btn btn-ghost" href="#/route/${p.route}" data-close>${icon('route')} ${t('place.route')}</a>` : ''}
        ${p.pos ? `<a class="btn btn-text" target="_blank" rel="noopener" href="${NA.map.googleUrl(p.pos[0], p.pos[1])}">${icon('nav')} ${t('place.openMaps')}</a>` : ''}
        <a class="btn btn-text" target="_blank" rel="noopener" href="${p.source}">${t('place.source')} ${icon('chevronR')}</a>
      </div>`);
    const ci = sh.querySelector('[data-checkin]');
    if (ci) ci.onclick = () => checkIn(p, ci);
  }

  // Check-in: verified with GPS when within 5 km of the indicative position, otherwise manual
  function checkIn(p, btn) {
    const save = (verified) => {
      NA.store.mutate(s => { s.visits[p.id] = { date: new Date().toISOString(), verified }; });
      NA.u.closeSheet();
      NA.u.toast(`${icon('passport')} ${t('place.stamped')}`, 'success');
      NA.app.render();
    };
    if (!p.pos || !NA.map.gpsSupported() || !window.isSecureContext) return manual();
    btn.disabled = true; btn.innerHTML = `${icon('locate')} ${t('gps.asking')}`;
    let done = false;
    const stop = NA.map.watch(pos => {
      if (done) return; done = true; stop();
      const d = NA.u.haversine([pos.lat, pos.lng], p.pos);
      if (d <= 5000) save(true);
      else manual(t('place.far', { d: NA.u.fmtKm(d) }));
    }, err => { if (done) return; done = true; stop(); manual(NA.map.gpsErrorText(err)); });
    function manual(reason) {
      const sh = NA.u.sheet(`<div class="sheet-head"><h2>${t('place.manualTitle')}</h2><p class="muted">${reason ? esc(reason) + ' ' : ''}${t('place.manualText')}</p></div>
        <div class="cta-stack"><button class="btn btn-primary" data-yes>${icon('check')} ${t('place.manualYes')}</button><button class="btn btn-text" data-close>${t('cancel')}</button></div>`);
      sh.querySelector('[data-yes]').onclick = () => save(false);
    }
  }

  NA.views.hidden = {
    title: () => t('hidden.title'),
    render() {
      const visits = NA.store.get().visits;
      const types = [...new Set(NA.places.map(p => p.type))];
      return `
      <section class="page-hero small"><img src="${NA.photos.reservoir}" alt=""><div class="hero-shade"></div>
        <div class="wrap page-hero-inner"><span class="eyebrow light">${t('hidden.eyebrow')}</span><h1>${t('hidden.title')}</h1><p>${t('hidden.sub')}</p></div></section>
      <section class="wrap section">
        <div class="card map-card"><div id="hidden-map" class="map map-md"></div>
          <p class="fine pad">${icon('info')} ${t('hidden.mapNote')}</p></div>
        <div class="chips" role="toolbar">
          <button class="chip on" data-type="all">${t('all')}</button>
          ${types.map(ty => `<button class="chip" data-type="${ty}">${icon(typeIcon[ty])} ${t('ptype.' + ty)}</button>`).join('')}
        </div>
        <div class="place-grid">${NA.places.map(p => `
          <article class="place-card" data-ptype="${p.type}">
            <button class="place-open" data-place="${p.id}" aria-label="${esc(L(p.title))}">
              <img src="${p.image}" alt="" loading="lazy">
              ${visits[p.id] ? `<span class="stamp-corner">${icon('check')}</span>` : ''}
            </button>
            <div class="place-body">
              <span class="eyebrow">${icon(typeIcon[p.type])} ${t('ptype.' + p.type)}</span>
              <h3>${esc(L(p.title))}</h3>
              <p>${esc(L(p.text))}</p>
              <div class="row between"><span class="small muted">${icon('nav')} ${esc(L(p.access))}</span>
              <button class="btn btn-text" data-place="${p.id}">${t('discover.more')} ${icon('chevronR')}</button></div>
            </div>
          </article>`).join('')}</div>
        <p class="fine mt">${t('hidden.source')}</p>
      </section>`;
    },
    mount(root, p) {
      const map = NA.map.create(root.querySelector('#hidden-map'));
      if (map) {
        const g = window.L.featureGroup().addTo(map);
        NA.places.filter(x => x.pos).forEach(pl => {
          // Approximate area circle + marker, never a precise pin
          window.L.circle(pl.pos, { radius: 1500, color: '#2BA8A4', weight: 1, dashArray: '4 6', fillOpacity: .08 }).addTo(g);
          window.L.marker(pl.pos, { icon: NA.map.divIcon('mk-place', icon(typeIcon[pl.type]), 36) }).addTo(g)
            .bindTooltip(esc(L(pl.title))).on('click', () => openPlace(pl));
        });
        map.fitBounds(g.getBounds(), { padding: [20, 20] });
      }
      root.querySelectorAll('[data-place]').forEach(b => b.onclick = () => openPlace(NA.places.find(x => x.id === b.dataset.place)));
      root.querySelectorAll('[data-type]').forEach(c => c.onclick = () => {
        root.querySelectorAll('[data-type]').forEach(x => x.classList.toggle('on', x === c));
        root.querySelectorAll('.place-card').forEach(card => card.hidden = !(c.dataset.type === 'all' || card.dataset.ptype === c.dataset.type));
      });
      if (p.id) { const pl = NA.places.find(x => x.id === p.id); if (pl) setTimeout(() => openPlace(pl), 250); }
      return () => map && map.remove();
    }
  };
})();

/* ---- js/views/play.js ---- */
/* PLAY – "The Secret of Valencia" outdoor escape game */
(function () {
  const t = (...a) => NA.i18n.t(...a), L = (o) => NA.i18n.L(o), esc = (s) => NA.u.esc(s), icon = (n, c) => NA.icon(n, c);
  const G = () => NA.game;
  const gs = () => NA.store.get().game;
  const save = (fn) => NA.store.mutate(s => fn(s.game), { silent: true });
  let cleanup = [];

  const sealsBar = (g) => `<div class="seals">${G().steps.map((st, i) => {
    const solved = g.solved[st.id], cur = i === g.step && !g.done;
    return `<span class="seal ${solved ? 'solved' : ''} ${cur ? 'current' : ''}" title="${esc(L(st.title))}">${solved ? icon('unlock') : i + 1}</span>`;
  }).join('')}</div>`;

  /* ---------- Intro ---------- */
  function intro() {
    const g = gs();
    return `
      <section class="game-hero"><img src="${NA.photos.reservoir}" alt=""><div class="hero-shade"></div>
        <div class="wrap game-hero-inner"><span class="eyebrow light">${t('play.eyebrow')}</span><h1>${esc(L(G().title))}</h1><p>${esc(L(G().subtitle))}</p></div></section>
      <section class="wrap section game-intro">
        <div class="notebook"><span class="eyebrow">${t('play.story')}</span><p>${esc(L(G().story))}</p></div>
        <div class="card">
          <h3>${t('play.setup')}</h3>
          <form id="gameSetup" class="form">
            <label>${t('play.team')}<input name="team" maxlength="40" placeholder="${t('play.teamPh')}" value="${esc(g?.team || NA.store.get().profile.name || '')}"></label>
            <fieldset><legend>${t('play.mode')}</legend><div class="choice-grid three">
              ${['adults', 'family', 'friends'].map((m, i) => `<label class="choice radio"><input type="radio" name="mode" value="${m}" ${i === 0 ? 'checked' : ''}><span>${icon(m === 'family' ? 'family' : m === 'friends' ? 'users' : 'mountain')} ${t('play.mode.' + m)}</span></label>`).join('')}
            </div></fieldset>
            <button class="btn btn-primary btn-lg" type="submit">${icon('play')} ${t('play.start')}</button>
          </form>
        </div>
        <div class="how">
          <div>${icon('lock')}<b>${t('play.how1')}</b><small>${t('play.how1s')}</small></div>
          <div>${icon('bulb')}<b>${t('play.how2')}</b><small>${t('play.how2s')}</small></div>
          <div>${icon('locate')}<b>${t('play.how3')}</b><small>${t('play.how3s')}</small></div>
        </div>
      </section>`;
  }

  /* ---------- Step ---------- */
  function stepView() {
    const g = gs(), st = G().steps[g.step];
    const pct = Object.keys(g.solved).length / G().steps.length * 100;
    return `
      <section class="wrap section game-step">
        <div class="game-bar">
          <div class="row between"><span class="eyebrow">${esc(g.team || t('play.teamDefault'))} · ${t('play.mode.' + g.mode)}</span><span class="points">${icon('star')} <b id="pts">${g.points}</b></span></div>
          ${sealsBar(g)}
          <div class="progress"><i style="width:${pct}%"></i></div>
        </div>
        <article class="card step-card" data-type="${st.type}">
          <span class="eyebrow">${t('play.type.' + st.type)}</span>
          <h2>${esc(L(st.title))}</h2>
          <p class="q">${esc(L(st.question))}</p>
          <div id="stepBody">${body(st, g)}</div>
          <div id="feedback" class="feedback" aria-live="polite"></div>
          <div class="row between wrap gap-s mt">
            ${L(st.hint) ? `<button class="btn btn-text" data-hint>${icon('bulb')} ${g.hints[st.id] ? t('play.hintShown') : st.hintCost ? t('play.hintCost', { n: st.hintCost }) : t('play.hint')}</button>` : '<span></span>'}
            <button class="btn btn-text small" data-quit>${t('play.quit')}</button>
          </div>
          <div id="hintBox" class="hint ${g.hints[st.id] ? '' : 'hidden'}">${icon('bulb')} ${esc(L(st.hint))}</div>
        </article>
      </section>`;
  }

  function body(st, g) {
    switch (st.type) {
      case 'choice':
      case 'photo-choice':
        return `${st.image ? `<img class="step-img" src="${st.image}" alt="${t('play.photoAlt')}">` : ''}
          <div class="options">${L(st.options).map((o, i) => `<button class="option" data-opt="${i}"><span>${String.fromCharCode(65 + i)}</span>${esc(o)}</button>`).join('')}</div>`;
      case 'search': {
        const checked = (g.data.search || {});
        return `<ul class="checklist">${L(st.items).map((it, i) => `<li><label class="check ${checked[i] ? 'on' : ''}"><input type="checkbox" data-i="${i}" ${checked[i] ? 'checked' : ''}><span class="box">${icon('check')}</span><span><b>${esc(it)}</b></span></label></li>`).join('')}</ul>
          <button class="btn btn-primary mt" data-search-done disabled>${icon('unlock')} ${t('play.breakSeal')}</button>`;
      }
      case 'puzzle':
        return `<div class="puzzle" style="--n:${st.size}" id="puzzle"></div><p class="fine">${t('play.puzzleHelp')}</p>`;
      case 'riddle':
        return `<form class="row gap-s" id="riddleForm"><input class="grow" name="a" autocomplete="off" placeholder="${t('play.answerPh')}" aria-label="${t('play.answerPh')}"><button class="btn btn-primary">${t('play.check')}</button></form>`;
      case 'code':
        return `<div class="code-key"><span class="eyebrow">${t('play.key')}</span><div class="key-grid">${Object.entries(st.key).map(([sym, d]) => `<span><i>${sym}</i><b>${d}</b></span>`).join('')}</div></div>
          <div class="carved">${st.carved.map(s => `<span>${s}</span>`).join('')}</div>
          <div class="padlock"><div class="pad-display" id="padDisplay">${'<i>–</i>'.repeat(st.code.length)}</div>
          <div class="keypad">${[1, 2, 3, 4, 5, 6, 7, 8, 9, 'C', 0, 'OK'].map(k => `<button data-k="${k}" class="${k === 'OK' ? 'ok' : ''}">${k === 'C' ? icon('x') : k === 'OK' ? icon('unlock') : k}</button>`).join('')}</div></div>`;
      case 'location':
        return `<div class="loc-box"><div class="loc-ring" id="locRing" style="--p:0"><b id="locDist">0 m</b><small>/ ${st.meters} m</small></div>
          <div class="cta-stack"><button class="btn btn-primary" data-gps>${icon('locate')} ${t('play.locStart')}</button>
          <button class="btn btn-ghost" data-demo>${icon('play')} ${t('play.locDemo')}</button></div>
          <p class="fine" id="locMsg">${t('play.locNote')}</p></div>`;
    }
    return '';
  }

  function feedback(ok, text) {
    const f = document.getElementById('feedback');
    if (!f) return;
    f.className = 'feedback ' + (ok ? 'ok' : 'bad');
    f.innerHTML = `${icon(ok ? 'check' : 'x')} ${text}`;
    if (!ok) { const c = document.querySelector('.step-card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
  }

  function solve(extraText = '', demo = false) {
    const g = gs(), st = G().steps[g.step];
    const gained = Math.max(10, st.points - (g.hints[st.id] ? st.hintCost : 0) - (g.data.mistakes?.[st.id] || 0) * 10);
    save(gm => { gm.solved[st.id] = demo ? 'demo' : true; gm.points += gained; gm.data.search = {}; });
    const last = g.step >= G().steps.length - 1;
    const card = document.querySelector('.step-card');
    card.classList.add('unlocked');
    document.getElementById('stepBody').insertAdjacentHTML('beforeend', `
      <div class="seal-broken">${icon('unlock')}<b>${t('play.sealBroken')}</b><span>+${gained} ${t('play.points')}</span>${extraText ? `<p>${esc(extraText)}</p>` : ''}
      <button class="btn btn-primary" data-next>${last ? t('play.openNotebook') : t('play.nextSeal')} ${icon('chevronR')}</button></div>`);
    card.querySelectorAll('.option, .keypad button, [data-gps], [data-demo]').forEach(b => b.disabled = true);
    card.querySelector('[data-next]').onclick = () => {
      if (last) {
        save(gm => { gm.done = true; gm.completedAt = new Date().toISOString(); });
        NA.store.addAdventure({ kind: 'game', refId: G().id, title: G().title, mode: gs().mode, km: 0, gain: 0, source: 'game', points: gs().points });
      } else save(gm => { gm.step++; });
      NA.app.render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    NA.u.confetti();
  }

  const mistake = () => save(gm => { gm.data.mistakes = gm.data.mistakes || {}; const id = G().steps[gm.step].id; gm.data.mistakes[id] = (gm.data.mistakes[id] || 0) + 1; });

  function mountStep(root) {
    const g = gs(), st = G().steps[g.step];
    const hb = root.querySelector('[data-hint]');
    if (hb) hb.onclick = () => {
      if (!gs().hints[st.id]) save(gm => { gm.hints[st.id] = true; });
      root.querySelector('#hintBox').classList.remove('hidden');
      hb.innerHTML = `${icon('bulb')} ${t('play.hintShown')}`;
    };
    root.querySelector('[data-quit]').onclick = () => {
      NA.u.sheet(`<div class="sheet-head"><h2>${t('play.quitTitle')}</h2><p class="muted">${t('play.quitText')}</p></div>
        <div class="cta-stack"><a class="btn btn-ghost" href="#/discover" data-close>${t('play.pause')}</a><button class="btn btn-danger" data-reset>${t('play.restart')}</button></div>`)
        .querySelector('[data-reset]').onclick = () => { NA.store.mutate(s => { s.game = null; }, { silent: true }); NA.u.closeSheet(); NA.app.render(); };
    };

    if (st.type === 'choice' || st.type === 'photo-choice') {
      root.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
        if (+b.dataset.opt === st.answer) { b.classList.add('right'); feedback(true, t('play.correct')); solve(); }
        else { b.classList.add('wrong'); b.disabled = true; mistake(); feedback(false, t('play.wrong')); }
      });
    }
    if (st.type === 'search') {
      const btn = root.querySelector('[data-search-done]');
      const n = L(st.items).length;
      const check = () => { const c = gs().data.search || {}; btn.disabled = Object.values(c).filter(Boolean).length < n; };
      root.querySelectorAll('input[data-i]').forEach(i => i.onchange = () => {
        save(gm => { gm.data.search = gm.data.search || {}; gm.data.search[i.dataset.i] = i.checked; });
        i.closest('.check').classList.toggle('on', i.checked); check();
      });
      check();
      btn.onclick = () => { feedback(true, t('play.searchDone')); btn.remove(); solve(); };
    }
    if (st.type === 'puzzle') {
      const n = st.size, N = n * n, el = root.querySelector('#puzzle');
      let order = g.data.puzzle;
      if (!order || order.length !== N) {
        do { order = [...Array(N).keys()].sort(() => Math.random() - .5); } while (order.every((v, i) => v === i));
        save(gm => { gm.data.puzzle = order; });
      }
      let sel = null;
      const draw = () => {
        el.innerHTML = order.map((v, i) => `<button class="tile ${sel === i ? 'sel' : ''} ${v === i ? 'fit' : ''}" data-i="${i}" aria-label="${t('play.tile')} ${i + 1}"
          style="background-image:url(${st.image});background-position:${(v % n) / (n - 1) * 100}% ${Math.floor(v / n) / (n - 1) * 100}%"></button>`).join('');
        el.querySelectorAll('.tile').forEach(b => b.onclick = () => {
          const i = +b.dataset.i;
          if (sel === null) { sel = i; draw(); return; }
          if (sel !== i) { [order[sel], order[i]] = [order[i], order[sel]]; save(gm => { gm.data.puzzle = order.slice(); }); }
          sel = null; draw();
          if (order.every((v, k) => v === k)) { el.classList.add('solved'); el.querySelectorAll('.tile').forEach(x => x.disabled = true); save(gm => { gm.data.puzzle = null; }); feedback(true, t('play.puzzleDone')); solve(); }
        });
      };
      draw();
    }
    if (st.type === 'riddle') {
      root.querySelector('#riddleForm').onsubmit = (e) => {
        e.preventDefault();
        const v = NA.u.norm(e.target.a.value);
        if (!v) return;
        const all = Object.values(st.answers).flat().map(NA.u.norm); // accept any language
        if (all.includes(v)) { e.target.querySelector('button').disabled = true; e.target.a.disabled = true; feedback(true, t('play.correct')); solve(); }
        else { mistake(); feedback(false, t('play.wrongRiddle')); }
      };
    }
    if (st.type === 'code') {
      let entry = '';
      const disp = root.querySelector('#padDisplay');
      const draw = () => { disp.innerHTML = Array.from({ length: st.code.length }, (_, i) => `<i class="${entry[i] ? 'f' : ''}">${entry[i] || '–'}</i>`).join(''); };
      root.querySelectorAll('.keypad button').forEach(b => b.onclick = () => {
        const k = b.dataset.k;
        if (k === 'C') entry = entry.slice(0, -1);
        else if (k === 'OK') {
          if (entry.length < st.code.length) return feedback(false, t('play.codeShort'));
          if (entry === st.code) { disp.classList.add('open'); feedback(true, t('play.codeOpen')); return solve(L(st.reveal)); }
          mistake(); disp.classList.add('err'); setTimeout(() => disp.classList.remove('err'), 500); feedback(false, t('play.codeWrong')); entry = '';
        } else if (entry.length < st.code.length) entry += k;
        draw();
      });
    }
    if (st.type === 'location') {
      const gpsBtn = root.querySelector('[data-gps]'), demoBtn = root.querySelector('[data-demo]');
      const ring = root.querySelector('#locRing'), dist = root.querySelector('#locDist'), msg = root.querySelector('#locMsg');
      let origin = null, stop = null, timer = null, slow = null, finished = false, running = false;
      // The demo option is always available, so the game can never get stuck on this step
      demoBtn.classList.remove('hidden');
      const show = (m) => { dist.textContent = Math.round(m) + ' m'; ring.style.setProperty('--p', Math.min(1, m / st.meters)); };
      const stopGps = () => { running = false; stop && stop(); stop = null; clearTimeout(slow); origin = null; gpsBtn.innerHTML = `${icon('locate')} ${t('play.locRetry')}`; };
      const done = (demo) => { if (finished) return; finished = true; stopGps(); clearInterval(timer); feedback(true, demo ? t('play.locDoneDemo') : t('play.locDone')); solve('', demo); };
      const warn = (txt) => { msg.textContent = txt; msg.classList.add('warn'); };
      const fail = (txt) => { stopGps(); warn(txt); };
      if (location.protocol === 'file:') warn(t('play.locLocal'));
      else if (!NA.map.gpsSupported() || !window.isSecureContext) warn(NA.map.gpsErrorText(null));
      gpsBtn.onclick = () => {
        if (running) { stopGps(); msg.classList.remove('warn'); msg.textContent = t('play.locNote'); return; }   // tap again = stop
        if (!NA.map.gpsSupported() || !window.isSecureContext) return fail(NA.map.gpsErrorText(null));
        running = true;
        gpsBtn.innerHTML = `${icon('stop')} ${t('play.locStop')}`;
        msg.classList.remove('warn'); msg.textContent = t('gps.asking');
        // No answer from the browser after 12 s (e.g. no prompt shown)? Say so instead of waiting silently.
        slow = setTimeout(() => { if (running && !origin) warn(t('play.locSlow')); }, 12000);
        stop = NA.map.watch(pos => {
          if (!running) return;
          if (!origin) { clearTimeout(slow); origin = [pos.lat, pos.lng]; msg.classList.remove('warn'); msg.textContent = t('play.locGo', { acc: Math.round(pos.acc) }); return; }
          const d = NA.u.haversine(origin, [pos.lat, pos.lng]);
          show(d);
          if (d >= st.meters) done(false);
        }, err => fail(NA.map.gpsErrorText(err)));
        cleanup.push(() => { stop && stop(); clearTimeout(slow); });
      };
      // Demo fallback – clearly labelled, does not use location data
      demoBtn.onclick = () => {
        stopGps();
        demoBtn.disabled = true; gpsBtn.disabled = true; let m = 0;
        msg.textContent = t('play.locDemoRunning'); msg.classList.remove('warn');
        timer = setInterval(() => { m += st.meters / 25; show(m); if (m >= st.meters) done(true); }, 80);
        cleanup.push(() => clearInterval(timer));
      };
    }
  }

  /* ---------- Finale ---------- */
  function finale() {
    const g = gs();
    const mins = Math.max(1, Math.round((new Date(g.completedAt) - new Date(g.startedAt)) / 60000));
    const shareText = t('play.shareText', { team: g.team || t('play.teamDefault'), pts: g.points, min: mins });
    return `
      <section class="wrap section game-finale">
        <div class="finale-card">
          <div class="finale-medal">${NA.ui.badge(NA.badges.find(b => b.id === 'valencia'), true, 'xl')}</div>
          <span class="eyebrow">${t('play.finaleEyebrow')}</span>
          <h1>${t('play.finaleTitle')}</h1>
          <div class="notebook open"><p>${esc(L(G().finale))}</p></div>
          <div class="stat-row">
            <div class="stat">${icon('star')}<b>${g.points}</b><small>${t('play.points')}</small></div>
            <div class="stat">${icon('clock')}<b>${mins} min</b><small>${t('play.time')}</small></div>
            <div class="stat">${icon('bulb')}<b>${Object.keys(g.hints).length}</b><small>${t('play.hintsUsed')}</small></div>
          </div>
          ${Object.values(g.solved).includes('demo') ? `<p class="fine">${t('play.demoUsed')}</p>` : ''}
          <div class="cta-stack">
            <a class="btn btn-wa" target="_blank" rel="noopener" href="${NA.contact.shareWa(shareText)}">${icon('share')} ${t('play.share')}</a>
            <a class="btn btn-ghost" href="#/passport">${icon('passport')} ${t('walk.toPassport')}</a>
            <a class="btn btn-ghost" target="_blank" rel="noopener" href="${NA.contact.link('group', t('play.bookGroup'))}">${icon('users')} ${t('play.bookGroupBtn')}</a>
            <button class="btn btn-text" data-replay>${t('play.replay')}</button>
          </div>
        </div>
      </section>`;
  }

  NA.views.play = {
    title: () => t('nav.play'),
    render() {
      const g = gs();
      if (!g) return intro();
      if (g.done) return finale();
      return stepView();
    },
    mount(root) {
      cleanup.forEach(f => f()); cleanup = [];
      const g = gs();
      if (!g) {
        root.querySelector('#gameSetup').onsubmit = (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          NA.store.mutate(s => { s.game = { team: (fd.get('team') || '').trim().slice(0, 40), mode: fd.get('mode'), step: 0, points: 0, hints: {}, solved: {}, data: {}, startedAt: new Date().toISOString(), done: false }; }, { silent: true });
          NA.app.render();
          window.scrollTo({ top: 0 });
        };
      } else if (g.done) {
        root.querySelector('[data-replay]').onclick = () => { NA.store.mutate(s => { s.game = null; }, { silent: true }); NA.app.render(); };
      } else mountStep(root);
      return () => { cleanup.forEach(f => f()); cleanup = []; };
    }
  };
})();

/* ---- js/views/memories.js ---- */
/* MEMORIES – personal travel diary with photos, ratings & reviews (device-only) */
(function () {
  const t = (...a) => NA.i18n.t(...a), L = (o) => NA.i18n.L(o), esc = (s) => NA.u.esc(s), icon = (n, c) => NA.icon(n, c);
  const MAX_PHOTOS = 4;

  function memoryText(m) {
    const tour = NA.tours.find(x => x.id === m.tour);
    return `${m.title}${tour ? ' – ' + L(tour.title) : ''}\n${'★'.repeat(m.rating)}${'☆'.repeat(5 - m.rating)}\n${m.highlight ? '“' + m.highlight + '”\n' : ''}${m.review ? m.review + '\n' : ''}#NuestraAventura #Valencia`;
  }

  function openForm(preset = {}, editing = null) {
    const m = editing || { title: '', tour: preset.tour || '', date: new Date().toISOString().slice(0, 10), highlight: '', rating: 5, review: '', photos: [] };
    let photos = m.photos.slice();
    const sh = NA.u.sheet(`
      <div class="sheet-head"><span class="eyebrow">${t('nav.memories')}</span><h2>${editing ? t('mem.edit') : t('mem.new')}</h2></div>
      <form class="form" id="memForm">
        <label>${t('mem.titleLbl')}<input name="title" required maxlength="80" value="${esc(m.title)}" placeholder="${t('mem.titlePh')}"></label>
        <div class="row gap-s">
          <label class="grow">${t('log.tour')}<select name="tour"><option value="">${t('mem.noTour')}</option>${NA.tours.map(x => `<option value="${x.id}" ${x.id === m.tour ? 'selected' : ''}>${esc(L(x.title))}</option>`).join('')}</select></label>
          <label class="grow">${t('log.date')}<input type="date" name="date" value="${esc((m.date || '').slice(0, 10))}"></label>
        </div>
        <div class="field"><span>${t('mem.photos')} <small class="muted">(${t('mem.max', { n: MAX_PHOTOS })})</small></span>
          <div class="photo-pick" id="photoPick"></div>
          <input type="file" accept="image/*" multiple id="photoInput" hidden></div>
        <label>${t('mem.highlight')}<input name="highlight" maxlength="140" value="${esc(m.highlight)}" placeholder="${t('mem.highlightPh')}"></label>
        <div class="field"><span>${t('mem.rating')}</span>${NA.ui.stars(m.rating, true)}</div>
        <label>${t('mem.review')}<textarea name="review" rows="4" maxlength="1200" placeholder="${t('mem.reviewPh')}">${esc(m.review)}</textarea></label>
        <p class="fine">${icon('lock')} ${t('mem.localNote')}</p>
        <button class="btn btn-primary btn-lg" type="submit">${icon('check')} ${t('mem.save')}</button>
      </form>`, { wide: true });
    NA.ui.bindStars(sh);
    const pick = sh.querySelector('#photoPick'), input = sh.querySelector('#photoInput');
    const drawPhotos = () => {
      pick.innerHTML = photos.map((p, i) => `<div class="ph"><img src="${p}" alt=""><button type="button" data-rm="${i}" aria-label="${t('delete')}">${icon('x')}</button></div>`).join('')
        + (photos.length < MAX_PHOTOS ? `<button type="button" class="ph add" data-add>${icon('camera')}<small>${t('mem.addPhoto')}</small></button>` : '');
      pick.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { photos.splice(+b.dataset.rm, 1); drawPhotos(); });
      const add = pick.querySelector('[data-add]'); if (add) add.onclick = () => input.click();
    };
    drawPhotos();
    input.onchange = async () => {
      const files = Array.from(input.files).slice(0, MAX_PHOTOS - photos.length);
      for (const f of files) {
        try { photos.push(await NA.u.compressImage(f)); } catch (e) { NA.u.toast(t('mem.photoErr'), 'error'); }
      }
      input.value = ''; drawPhotos();
    };
    sh.querySelector('#memForm').onsubmit = (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        title: fd.get('title').trim(), tour: fd.get('tour'), date: fd.get('date') || new Date().toISOString().slice(0, 10),
        highlight: fd.get('highlight').trim(), rating: +fd.get('rating') || 5, review: fd.get('review').trim(), photos
      };
      const ok = NA.store.mutate(s => {
        if (editing) Object.assign(s.memories.find(x => x.id === editing.id), data);
        else s.memories.unshift(Object.assign({ id: NA.u.uid(), createdAt: new Date().toISOString() }, data));
      }, { silent: true });
      if (!ok) {
        // storage full: roll back so state matches what is on disk
        NA.store.init();
        return;
      }
      NA.u.closeSheet();
      NA.u.toast(t('mem.saved'), 'success');
      if (location.hash !== '#/memories') location.hash = '#/memories'; else NA.app.render();
    };
  }

  function viewMemory(m) {
    const tour = NA.tours.find(x => x.id === m.tour);
    NA.u.sheet(`
      ${m.photos.length ? `<div class="gallery">${m.photos.map(p => `<img src="${p}" alt="">`).join('')}</div>` : ''}
      <div class="sheet-head"><span class="eyebrow">${NA.u.fmtDate(m.date)}${tour ? ' · ' + esc(L(tour.title)) : ''}</span><h2>${esc(m.title)}</h2>${NA.ui.stars(m.rating)}</div>
      ${m.highlight ? `<blockquote>${esc(m.highlight)}</blockquote>` : ''}
      ${m.review ? `<p>${esc(m.review).replace(/\n/g, '<br>')}</p>` : ''}
      <p class="fine">${icon('lock')} ${t('mem.private')}</p>
      <div class="cta-stack">
        <a class="btn btn-wa" target="_blank" rel="noopener" href="${NA.contact.shareWa(memoryText(m))}">${icon('share')} ${t('mem.shareWa')}</a>
        <a class="btn btn-ghost" target="_blank" rel="noopener" href="${NA.contact.wa(t('mem.sendIntro') + '\n\n' + memoryText(m))}">${icon('whatsapp')} ${t('mem.sendNA')}</a>
        <div class="row gap-s"><button class="btn btn-text grow" data-edit>${icon('edit')} ${t('edit')}</button><button class="btn btn-text danger grow" data-del>${icon('trash')} ${t('delete')}</button></div>
      </div>
      <p class="fine">${t('mem.photosNote')}</p>`, { wide: true });
    const sh = document.querySelector('.sheet');
    sh.querySelector('[data-edit]').onclick = () => openForm({}, m);
    sh.querySelector('[data-del]').onclick = () => {
      NA.u.sheet(`<div class="sheet-head"><h2>${t('mem.delTitle')}</h2><p class="muted">${esc(m.title)}</p></div>
        <div class="cta-stack"><button class="btn btn-danger" data-yes>${icon('trash')} ${t('delete')}</button><button class="btn btn-text" data-close>${t('cancel')}</button></div>`)
        .querySelector('[data-yes]').onclick = () => { NA.store.mutate(s => { s.memories = s.memories.filter(x => x.id !== m.id); }); NA.u.closeSheet(); };
    };
  }

  NA.views.memories = {
    title: () => t('nav.memories'),
    autoRefresh: true,
    render() {
      const mems = NA.store.get().memories;
      return `
      <section class="page-hero small"><img src="${NA.photos.reservoir}" alt=""><div class="hero-shade"></div>
        <div class="wrap page-hero-inner"><span class="eyebrow light">${t('mem.eyebrow')}</span><h1>${t('mem.title')}</h1><p>${t('mem.sub')}</p></div></section>
      <section class="wrap section">
        <div class="notice">${icon('lock')}<div><b>${t('mem.noticeTitle')}</b><p>${t('mem.noticeText')}</p></div></div>
        <div class="row between wrap gap-s"><h2 class="h-inline">${t('mem.mine')} <span class="count">${mems.length}</span></h2>
          <button class="btn btn-primary" data-new>${icon('plus')} ${t('mem.new')}</button></div>
        ${mems.length ? `<div class="mem-grid">${mems.map(m => {
          const tour = NA.tours.find(x => x.id === m.tour);
          return `<article class="mem-card" data-id="${m.id}" tabindex="0" role="button">
            <div class="mem-media ${m.photos.length > 1 ? 'multi' : ''}">${m.photos.length ? m.photos.slice(0, 3).map(p => `<img src="${p}" alt="">`).join('') : `<img src="${tour ? tour.image : NA_ASSET['assets/img/hills.svg']}" alt="">`}
            ${m.photos.length > 3 ? `<span class="more">+${m.photos.length - 3}</span>` : ''}</div>
            <div class="mem-body"><div class="row between"><small class="muted">${NA.u.fmtDate(m.date)}</small>${NA.ui.stars(m.rating)}</div>
            <h3>${esc(m.title)}</h3>${m.highlight ? `<p class="quote">“${esc(m.highlight)}”</p>` : ''}
            ${tour ? `<span class="chip static">${icon(tour.icon)} ${esc(L(tour.title))}</span>` : ''}</div></article>`;
        }).join('')}</div>`
          : NA.ui.empty('camera', t('mem.empty'), t('mem.emptyText'), `<button class="btn btn-primary" data-new>${icon('plus')} ${t('mem.new')}</button>`)}

        ${NA.ui.sectionHead(t('mem.publicEyebrow'), t('mem.publicTitle'), t('mem.publicText'))}
        <div class="row gap-s wrap"><a class="btn btn-ghost" href="${NA.brand.pages.experiences}" target="_blank" rel="noopener">${t('mem.publicLink')} ${icon('chevronR')}</a></div>
      </section>`;
    },
    mount(root, p) {
      root.querySelectorAll('[data-new]').forEach(b => b.onclick = () => openForm());
      root.querySelectorAll('.mem-card').forEach(c => {
        const open = () => viewMemory(NA.store.get().memories.find(m => m.id === c.dataset.id));
        c.onclick = open; c.onkeydown = (e) => { if (e.key === 'Enter') open(); };
      });
      if (p.id === 'new') setTimeout(() => openForm({ tour: p.query.tour || '' }), 200);
    }
  };
})();
