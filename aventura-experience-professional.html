/* ==========================================================================
   AVENTURA EXPERIENCE – design system
   Mediterranean palette: deep green, turquoise, sand, warm white
   ========================================================================== */
:root {
  --forest: #1F4D3A;
  --forest-deep: #143628;
  --forest-soft: #2F5A47;
  --turq: #2BA8A4;
  --turq-deep: #1F8F8C;
  --turq-soft: #DDF1EF;
  --sand: #E8D5B0;
  --sand-soft: #F4EBDD;
  --white: #FBF8F2;
  --paper: #FFFDF9;
  --terra: #D9774B;
  --ink: #1D2A24;
  --muted: #5F6E66;
  --line: rgba(31, 77, 58, .12);
  --wa: #1FAF5B;
  --danger: #B9472C;

  --r-s: 10px; --r: 18px; --r-l: 28px; --r-xl: 36px;
  --shadow-s: 0 1px 2px rgba(20, 54, 40, .06), 0 2px 8px rgba(20, 54, 40, .05);
  --shadow: 0 6px 24px rgba(20, 54, 40, .10), 0 2px 6px rgba(20, 54, 40, .05);
  --shadow-l: 0 18px 50px rgba(20, 54, 40, .18);
  --f-display: 'Fraunces', 'Iowan Old Style', Georgia, serif;
  --f-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --top-h: 62px;
  --nav-h: 68px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; font-family: var(--f-body); color: var(--ink); background: var(--white);
  font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + var(--safe-b));
  -webkit-tap-highlight-color: transparent;
}
body.no-scroll { overflow: hidden; }
img { max-width: 100%; display: block; }
a { color: var(--forest); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.12; letter-spacing: -.01em; margin: 0 0 .4em; color: var(--forest-deep); }
h1 { font-size: clamp(2rem, 6vw, 3.4rem); }
h2 { font-size: clamp(1.5rem, 3.6vw, 2.2rem); }
h3 { font-size: 1.2rem; }
p { margin: 0 0 1em; }
[hidden], .hidden { display: none !important; }
:focus-visible { outline: 3px solid var(--turq); outline-offset: 2px; border-radius: 6px; }
.ic { width: 1.25em; height: 1.25em; flex: none; vertical-align: -.25em; }

.skip { position: absolute; left: -999px; top: 8px; background: var(--forest); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }

/* ---------- layout ---------- */
.wrap { width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 18px; }
.narrow { max-width: 760px; }
.section { padding-top: 34px; padding-bottom: 14px; }
.row { display: flex; align-items: center; }
.between { justify-content: space-between; }
.center { justify-content: center; }
.wrap.row, .row.wrap { flex-wrap: wrap; }
.gap { gap: 18px; } .gap-s { gap: 10px; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 18px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.fine { font-size: .8rem; color: var(--muted); margin: 10px 0; }
.fine.warn { color: var(--danger); }
.fine .ic { width: 1.05em; height: 1.05em; }
.pad { padding: 0 14px 12px; }
.eyebrow { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--turq-deep); }
.eyebrow.light { color: var(--sand); }
.eyebrow .ic { width: 1.1em; height: 1.1em; }
.lead { font-size: 1.12rem; color: #33443b; max-width: 62ch; }

#view { min-height: 70vh; outline: none; }
#view.enter { animation: viewIn .45s var(--ease); }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- top bar & navigation ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40; height: calc(var(--top-h) + var(--safe-t)); padding: var(--safe-t) 16px 0;
  display: flex; align-items: center; gap: 16px;
  background: rgba(251, 248, 242, .86); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--forest-deep); }
.brand img { border-radius: 10px; box-shadow: var(--shadow-s); }
.brand span { display: flex; flex-direction: column; line-height: 1; }
.brand b { font-family: var(--f-display); font-size: 1.2rem; }
.brand small { font-size: .66rem; letter-spacing: .22em; text-transform: uppercase; color: var(--turq-deep); margin-top: 3px; }
.desktop-nav { display: none; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.lang { display: flex; align-items: center; gap: 4px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 10px; color: var(--forest); }
.lang select { border: 0; background: transparent; font-weight: 600; font-size: .85rem; padding: 4px 2px; cursor: pointer; appearance: none; -webkit-appearance: none; }
.profile-btn { display: block; border-radius: 50%; text-decoration: none; }

.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: rgba(255, 253, 249, .94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--line); box-shadow: 0 -6px 24px rgba(20, 54, 40, .06);
}
.bottom-nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7a877f; font-size: .68rem; font-weight: 600; position: relative; transition: color .2s; }
.bottom-nav a .ic { width: 24px; height: 24px; transition: transform .25s var(--ease); }
.bottom-nav a.active { color: var(--forest); }
.bottom-nav a.active .ic { transform: translateY(-2px); }
.bottom-nav a.active::before { content: ''; position: absolute; top: 6px; width: 46px; height: 32px; border-radius: 16px; background: var(--turq-soft); z-index: -1; }

@media (min-width: 900px) {
  body { padding-bottom: 0; }
  .bottom-nav { display: none; }
  .desktop-nav { display: flex; gap: 4px; margin-left: 24px; }
  .desktop-nav a { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: .92rem; transition: background .2s, color .2s; }
  .desktop-nav a:hover { background: var(--sand-soft); color: var(--forest); }
  .desktop-nav a.active { background: var(--forest); color: #fff; }
  .topbar { padding: 0 28px; }
  .section { padding-top: 56px; }
}

.offline-bar { background: var(--terra); color: #fff; text-align: center; font-size: .82rem; padding: 6px 12px; position: sticky; top: calc(var(--top-h) + var(--safe-t)); z-index: 39; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px;
  border-radius: 999px; border: 1.5px solid transparent; font-weight: 600; font-size: .95rem; text-decoration: none; white-space: nowrap;
  transition: transform .15s var(--ease), background .2s, box-shadow .2s, color .2s; cursor: pointer; background: none;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-lg { min-height: 54px; padding: 0 26px; font-size: 1rem; }
.btn-primary { background: var(--forest); color: #fff; box-shadow: 0 6px 16px rgba(31, 77, 58, .25); }
.btn-primary:hover { background: var(--forest-deep); }
.btn-ghost { border-color: var(--line); background: #fff; color: var(--forest); }
.btn-ghost:hover { border-color: var(--forest); }
.btn-text { color: var(--forest); padding: 0 8px; min-height: 40px; }
.btn-text:hover { color: var(--turq-deep); }
.btn-text.danger, .danger { color: var(--danger); }
.btn-sand { background: var(--sand); color: var(--forest-deep); }
.btn-sand:hover { background: #F0E1C2; }
.btn-glass { background: rgba(255, 255, 255, .16); color: #fff; border-color: rgba(255, 255, 255, .4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn-glass:hover { background: rgba(255, 255, 255, .26); }
.btn-wa { background: var(--wa); color: #fff; box-shadow: 0 6px 16px rgba(31, 175, 91, .28); }
.btn-wa:hover { background: #18984e; }
.btn-danger { background: var(--danger); color: #fff; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--sand-soft); color: var(--forest); }
.cta-stack { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; }
.cta-stack .btn { width: 100%; }
@media (min-width: 700px) { .detail .cta-stack { flex-direction: row; flex-wrap: wrap; } .detail .cta-stack .btn { width: auto; } }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: .85rem; font-weight: 600; color: var(--forest); text-decoration: none; cursor: pointer; transition: all .2s; }
.chip.on { background: var(--forest); color: #fff; border-color: var(--forest); }
.chip.static { cursor: default; background: var(--sand-soft); border-color: transparent; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px 2px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }

/* ---------- cards ---------- */
.card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px; box-shadow: var(--shadow-s); margin-bottom: 16px; }
.card.soft { background: var(--sand-soft); border-color: transparent; box-shadow: none; }
.card h3 { margin-bottom: 12px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 30px 0 16px; }
.section-head h2 { margin: 4px 0 4px; }
.section-head p { margin: 0; max-width: 60ch; }
.h-inline { margin: 0; font-size: 1.4rem; }
.count { display: inline-grid; place-items: center; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 99px; background: var(--turq-soft); color: var(--turq-deep); font-family: var(--f-body); font-size: .85rem; vertical-align: middle; }

.notice { display: flex; gap: 14px; padding: 16px 18px; border-radius: var(--r); background: var(--turq-soft); color: #164844; margin-bottom: 18px; }
.notice > .ic { width: 26px; height: 26px; color: var(--turq-deep); }
.notice p { margin: 4px 0 0; font-size: .9rem; }

.dots { display: inline-flex; gap: 3px; vertical-align: middle; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(31, 77, 58, .18); }
.dots i.on { background: var(--accent, var(--turq)); }

.src { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 6px; margin-top: 4px; }
.src-ok { background: #E3F3EA; color: #2C7A4E; }
.src-req { background: #FBEBDD; color: #A35A2E; }
.demo-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 4px 9px; border-radius: 8px; background: #FFF1D6; color: #8C5A12; border: 1px dashed #E2B65B; }
.demo-badge .ic { width: 1em; height: 1em; }
.demo-badge.gpx { background: var(--turq-soft); color: var(--turq-deep); border-color: var(--turq); }
.done-badge { display: inline-flex; align-items: center; gap: 4px; font-size: .7rem; font-weight: 700; padding: 4px 9px; border-radius: 8px; background: #E3F3EA; color: #2C7A4E; }
.done-badge .ic { width: 1em; height: 1em; }

/* ---------- hero ---------- */
.hero { position: relative; min-height: min(86vh, 720px); display: flex; align-items: flex-end; color: #fff; overflow: hidden; }
.hero-img, .page-hero > img, .detail-hero > img, .game-hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero-img { animation: slowZoom 24s ease-in-out infinite alternate; }
@keyframes slowZoom { from { transform: scale(1); } to { transform: scale(1.08); } }
.hero-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20, 54, 40, 0) 20%, rgba(20, 54, 40, .55) 62%, rgba(20, 54, 40, .88) 100%); }
.hero-inner { position: relative; width: 100%; max-width: 1180px; margin: 0 auto; padding: 0 22px 46px; }
.hero h1 { color: #fff; font-size: clamp(2.4rem, 8.5vw, 4.8rem); margin: 14px 0 16px; text-shadow: 0 2px 30px rgba(0, 0, 0, .2); }
.hero h1 em { font-style: italic; color: var(--sand); }
.hero p { max-width: 52ch; font-size: 1.08rem; color: rgba(255, 255, 255, .9); margin-bottom: 24px; }
.hero-kicker { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px; background: rgba(255, 255, 255, .16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); font-size: .82rem; font-weight: 600; }

.page-hero { position: relative; color: #fff; overflow: hidden; min-height: 260px; display: flex; align-items: flex-end; }
.page-hero.small { min-height: 230px; }
.page-hero-inner { position: relative; padding-bottom: 26px; padding-top: 40px; }
.page-hero h1 { color: #fff; margin: 6px 0 6px; font-size: clamp(1.9rem, 5vw, 3rem); }
.page-hero p { margin: 0; color: rgba(255, 255, 255, .88); max-width: 56ch; }

/* ---------- tour cards ---------- */
.tour-grid { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .tour-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1000px) { .tour-grid { grid-template-columns: repeat(3, 1fr); } .tour-grid.small { grid-template-columns: repeat(2, 1fr); } }
.tour-card { position: relative; background: var(--paper); border-radius: var(--r-l); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-s); display: flex; flex-direction: column; transition: transform .3s var(--ease), box-shadow .3s; }
.tour-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
.tour-media { position: relative; aspect-ratio: 16/10; overflow: hidden; display: block; }
.tour-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.tour-card:hover .tour-media img { transform: scale(1.06); }
.tour-icon { position: absolute; left: 14px; bottom: -20px; width: 46px; height: 46px; border-radius: 15px; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0, 0, 0, .18); border: 3px solid var(--paper); }
.tour-icon .ic { width: 22px; height: 22px; }
.tour-body { padding: 30px 20px 18px; display: flex; flex-direction: column; flex: 1; }
.tour-body h3 { font-size: 1.4rem; margin: 6px 0 8px; }
.tour-body h3 a { text-decoration: none; color: inherit; }
.tour-body p { color: var(--muted); font-size: .93rem; }
.tour-body .btn { align-self: flex-start; margin-top: auto; padding-left: 0; border: 0; background: none; }
.meta { list-style: none; padding: 0; margin: 0 0 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: .8rem; color: #3f5148; }
.meta li { display: flex; gap: 6px; align-items: flex-start; }
.meta .ic { color: var(--turq-deep); width: 16px; height: 16px; margin-top: 2px; }
.tour-card.compact .meta { grid-template-columns: 1fr; }
.reason { font-size: .85rem; color: var(--turq-deep); }
.fav-btn { position: absolute; top: 12px; right: 12px; z-index: 2; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(255, 255, 255, .9); color: var(--forest); box-shadow: var(--shadow-s); transition: transform .2s var(--ease); }
.fav-btn:active { transform: scale(.85); }
.fav-btn.on { color: #fff; background: var(--terra); }
.fav-btn.on .ic { fill: currentColor; }

/* ---------- finder ---------- */
.split { display: grid; gap: 24px; align-items: start; }
@media (min-width: 900px) { .split { grid-template-columns: 1fr 1.2fr; gap: 48px; } .split .section-head { margin-top: 0; } }
.ticks { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.ticks li { display: flex; gap: 10px; align-items: center; }
.ticks .ic { color: #fff; background: var(--turq); border-radius: 50%; padding: 3px; width: 22px; height: 22px; }
.finder { min-height: 360px; }
.finder-top { display: grid; gap: 10px; margin-bottom: 18px; }
.finder-q { font-size: 1.55rem; }
.progress { height: 8px; background: rgba(31, 77, 58, .08); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--turq), var(--forest)); border-radius: 99px; transition: width .5s var(--ease); }
.progress.big { height: 12px; margin: 14px 0 6px; }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.choice-grid.three { grid-template-columns: repeat(3, 1fr); }
.choice { min-height: 58px; padding: 12px 14px; border-radius: var(--r); border: 1.5px solid var(--line); background: #fff; font-weight: 600; color: var(--forest-deep); text-align: left; transition: all .2s var(--ease); display: flex; align-items: center; gap: 8px; }
.choice:hover { border-color: var(--turq); }
.choice.on, .choice.radio:has(input:checked) { border-color: var(--forest); background: var(--forest); color: #fff; transform: scale(1.02); }
.choice.radio { cursor: pointer; justify-content: center; text-align: center; font-size: .9rem; }
.choice.radio input { position: absolute; opacity: 0; pointer-events: none; }
.choice.radio span { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.finder-results { display: grid; gap: 12px; }
.finder-hit { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: var(--r); border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); background: #fff; transition: all .2s; }
.finder-hit:hover { border-color: var(--turq); }
.finder-hit.best { border-color: var(--turq); background: linear-gradient(120deg, #fff, var(--turq-soft)); box-shadow: var(--shadow-s); }
.finder-hit img { width: 76px; height: 76px; border-radius: 14px; object-fit: cover; }
.finder-hit div { flex: 1; display: flex; flex-direction: column; }
.finder-hit b { font-family: var(--f-display); font-size: 1.2rem; color: var(--forest-deep); }
.finder-hit small { color: var(--muted); }

/* ---------- prep ---------- */
.prep { display: grid; grid-template-columns: 1fr; gap: 10px; }
.prep-ring { --p: 0; width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--turq) calc(var(--p) * 360deg), rgba(31, 77, 58, .08) 0); margin-bottom: 6px; transition: --p .4s; }
.prep-ring span { width: 66px; height: 66px; border-radius: 50%; background: var(--paper); display: grid; place-items: center; font-weight: 700; color: var(--forest); }
.checklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r); background: #fff; border: 1.5px solid var(--line); cursor: pointer; transition: all .2s; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box { width: 26px; height: 26px; flex: none; border-radius: 8px; border: 2px solid rgba(31, 77, 58, .25); display: grid; place-items: center; color: transparent; transition: all .2s var(--ease); }
.check .box .ic { width: 16px; height: 16px; }
.check.on { border-color: var(--turq); background: var(--turq-soft); }
.check.on .box { background: var(--turq); border-color: var(--turq); color: #fff; transform: scale(1.08); }
.check span:last-child { display: flex; flex-direction: column; }
.check small { color: var(--muted); font-size: .8rem; }
.check:has(input:focus-visible) { outline: 3px solid var(--turq); }

/* ---------- feature band & minis ---------- */
.feature-band { position: relative; display: block; border-radius: var(--r-xl); overflow: hidden; color: #fff; text-decoration: none; min-height: 320px; box-shadow: var(--shadow); }
.feature-band img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
.feature-band:hover img { transform: scale(1.05); }
.feature-band::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(20, 54, 40, .92), rgba(20, 54, 40, .35)); }
.feature-band > div { position: relative; z-index: 1; padding: 34px 26px; max-width: 520px; }
.feature-band h2 { color: #fff; font-size: clamp(1.8rem, 5vw, 2.8rem); }
.feature-band p { color: rgba(255, 255, 255, .88); }
.h-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 14px; overflow-x: auto; padding: 4px 2px 14px; scroll-snap-type: x mandatory; scrollbar-width: thin; }
.place-mini { position: relative; display: block; aspect-ratio: 4/5; border-radius: var(--r-l); overflow: hidden; text-decoration: none; color: #fff; scroll-snap-align: start; box-shadow: var(--shadow-s); }
.place-mini img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.place-mini:hover img { transform: scale(1.06); }
.place-mini::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(20, 54, 40, .85)); }
.place-mini b { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 16px; font-family: var(--f-display); font-size: 1.2rem; line-height: 1.15; }
.place-type { position: absolute; z-index: 1; top: 12px; left: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(255, 255, 255, .9); color: var(--forest); font-size: .72rem; font-weight: 700; }
.feature-link { display: flex; align-items: center; gap: 14px; margin-top: 26px; padding: 18px; border-radius: var(--r-l); background: var(--forest); color: #fff; text-decoration: none; }
.feature-link > .ic:first-child { width: 30px; height: 30px; color: var(--sand); }
.feature-link span { flex: 1; display: flex; flex-direction: column; }
.feature-link small { color: rgba(255, 255, 255, .75); }

/* ---------- detail ---------- */
.detail-hero { position: relative; min-height: 44vh; display: flex; align-items: flex-end; color: #fff; overflow: hidden; }
.detail-hero-inner { position: relative; padding-bottom: 28px; }
.detail-hero h1 { color: #fff; margin-top: 6px; }
.back-btn { position: absolute; top: 14px; left: 14px; z-index: 5; width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, .92); color: var(--forest); display: grid; place-items: center; box-shadow: var(--shadow-s); }
.detail-hero .fav-btn { top: 14px; right: 14px; }
.facts { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 22px 0; }
@media (min-width: 640px) { .facts { grid-template-columns: repeat(2, 1fr); } .facts.two { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1000px) { .facts { grid-template-columns: repeat(3, 1fr); } .facts.two { grid-template-columns: 1fr 1fr; } }
.fact { display: flex; gap: 12px; padding: 14px 16px; background: #fff; border-radius: var(--r); border: 1px solid var(--line); }
.fact > .ic { width: 34px; height: 34px; padding: 7px; border-radius: 11px; background: var(--turq-soft); color: var(--turq-deep); }
.fact div { display: flex; flex-direction: column; }
.fact small { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.fact b { font-weight: 600; color: var(--forest-deep); }
.access-meter { font-size: .78rem; color: var(--muted); margin-top: 4px; }

/* ---------- lists & routes ---------- */
.list { display: grid; gap: 12px; }
.route-row { display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: var(--r-l); background: var(--paper); border: 1px solid var(--line); text-decoration: none; color: var(--ink); box-shadow: var(--shadow-s); transition: transform .2s var(--ease), box-shadow .2s; }
.route-row:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.route-row img { width: 88px; height: 88px; border-radius: var(--r); object-fit: cover; }
.route-row b { display: block; font-family: var(--f-display); font-size: 1.18rem; color: var(--forest-deep); margin: 6px 0 4px; }
.route-row small { color: var(--muted); font-size: .8rem; }
.route-row small .ic { width: 14px; height: 14px; }
.dropzone { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 28px; border: 2px dashed rgba(31, 77, 58, .25); border-radius: var(--r-l); background: #fff; cursor: pointer; text-align: center; transition: all .2s; }
.dropzone:hover, .dropzone.over { border-color: var(--turq); background: var(--turq-soft); }
.dropzone > .ic { width: 34px; height: 34px; color: var(--turq-deep); }
.dropzone small { color: var(--muted); }

/* ---------- maps ---------- */
.map { width: 100%; background: #dfe9e2; position: relative; z-index: 1; }
.map-md { height: 340px; }
.map-lg { height: 58vh; min-height: 340px; }
.map-card { padding: 0; overflow: hidden; }
.map-card .map { border-radius: var(--r-l) var(--r-l) 0 0; }
.map-card .fine.pad { padding-top: 12px; }
.map-error { display: grid; place-items: center; background: repeating-linear-gradient(45deg, #e8efe9, #e8efe9 12px, #e1eae3 12px, #e1eae3 24px); }
.map-error-box { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; max-width: 300px; padding: 20px; background: rgba(255, 255, 255, .92); border-radius: var(--r); color: var(--forest); }
.map-error-box .ic { width: 32px; height: 32px; }
.map-error-box span { font-size: .85rem; color: var(--muted); }
.route-top { position: relative; }
.map-banner { position: absolute; z-index: 500; left: 50%; transform: translateX(-50%); top: 16px; background: #FFF1D6; color: #8C5A12; border: 1px dashed #E2B65B; padding: 6px 12px; border-radius: 99px; font-size: .78rem; font-weight: 700; white-space: nowrap; box-shadow: var(--shadow-s); max-width: calc(100% - 140px); overflow: hidden; text-overflow: ellipsis; }
.map-fabs { position: absolute; z-index: 500; right: 12px; bottom: 26px; display: grid; gap: 10px; }
.fab-round { width: 50px; height: 50px; border-radius: 50%; border: 0; background: #fff; color: var(--forest); box-shadow: var(--shadow); display: grid; place-items: center; }
.fab-round .ic { width: 24px; height: 24px; }
.route-detail { margin-top: -18px; position: relative; z-index: 2; background: var(--white); border-radius: var(--r-xl) var(--r-xl) 0 0; }
.route-title { margin-top: 12px; }
.mk { display: grid !important; place-items: center; border-radius: 50%; color: #fff; box-shadow: 0 3px 10px rgba(0, 0, 0, .25); border: 3px solid #fff; }
.mk .ic { width: 16px; height: 16px; }
.mk-start { background: var(--forest); }
.mk-end { background: var(--terra); }
.mk-poi { background: var(--turq); font-weight: 700; font-size: .8rem; }
.mk-place { background: var(--forest); }
.mk-place .ic { width: 18px; height: 18px; }
.mk-me { background: #2F80ED; box-shadow: 0 0 0 6px rgba(47, 128, 237, .25); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 4px rgba(47, 128, 237, .3); } 50% { box-shadow: 0 0 0 12px rgba(47, 128, 237, .08); } }
.leaflet-popup-content-wrapper { border-radius: 16px; }
.leaflet-container { font-family: var(--f-body); }
.pop img { width: 100%; height: 96px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; }
.pop b { font-family: var(--f-display); font-size: 1.05rem; color: var(--forest-deep); }
.pop p { margin: 4px 0; font-size: .85rem; }
.pop small { color: #8C5A12; }

.stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 18px 0 4px; }
@media (min-width: 640px) { .stat-row { grid-template-columns: repeat(4, 1fr); } .game-finale .stat-row { grid-template-columns: repeat(3, 1fr); } }
.stat { padding: 14px; background: #fff; border-radius: var(--r); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.stat .ic { color: var(--turq-deep); }
.stat b { font-family: var(--f-display); font-size: 1.45rem; color: var(--forest-deep); }
.stat small { color: var(--muted); font-size: .78rem; }
.walk-card h3 { margin: 0; }
.walk-state { font-size: .78rem; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--sand-soft); color: var(--forest); }
.walk-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.walk-btns .btn-text { grid-column: 1 / -1; }
.profile { width: 100%; height: 110px; margin-top: 14px; display: block; }
.profile-axis { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); }
.profile-empty { font-size: .85rem; color: var(--muted); padding: 14px 0; }
.poi-list { display: grid; gap: 10px; }
.poi { display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px; border-radius: var(--r); background: #fff; border: 1px solid var(--line); transition: border-color .2s; }
.poi:hover { border-color: var(--turq); }
.poi img, .poi-ic { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; flex: none; }
.poi-ic { display: grid; place-items: center; background: var(--turq-soft); color: var(--turq-deep); }
.poi span { display: flex; flex-direction: column; }
.poi b { color: var(--forest-deep); }
.poi small:not(.eyebrow) { color: var(--muted); font-size: .82rem; }

/* ---------- hidden valencia ---------- */
.place-grid { display: grid; gap: 18px; margin-top: 10px; }
@media (min-width: 700px) { .place-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1050px) { .place-grid { grid-template-columns: repeat(3, 1fr); } }
.place-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; box-shadow: var(--shadow-s); display: flex; flex-direction: column; }
.place-open { position: relative; border: 0; padding: 0; aspect-ratio: 16/10; overflow: hidden; background: none; }
.place-open img { width: 100%; height: 100%; object-fit: cover; transition: transform .8s var(--ease); }
.place-card:hover .place-open img { transform: scale(1.05); }
.place-body { padding: 16px 18px; display: flex; flex-direction: column; flex: 1; }
.place-body h3 { margin: 6px 0; }
.place-body p { color: var(--muted); font-size: .9rem; flex: 1; }
.stamp-corner { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; background: var(--terra); color: #fff; display: grid; place-items: center; border: 3px solid #fff; box-shadow: var(--shadow-s); }
.stamp-inline { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 12px; border-radius: 99px; border: 2px dashed var(--terra); color: var(--terra); font-weight: 700; }

/* ---------- sheet (modal) ---------- */
.sheet-backdrop { position: fixed; inset: 0; z-index: 1000; background: rgba(20, 40, 32, .45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .25s; }
.sheet-backdrop.open { opacity: 1; }
.sheet { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--white); border-radius: var(--r-xl) var(--r-xl) 0 0; padding: 26px 22px calc(26px + var(--safe-b)); transform: translateY(40px); transition: transform .3s var(--ease); box-shadow: var(--shadow-l); }
.sheet::before { content: ''; position: absolute; top: 8px; left: 50%; width: 42px; height: 5px; margin-left: -21px; border-radius: 9px; background: rgba(31, 77, 58, .18); }
.sheet-wide { max-width: 680px; }
.sheet-backdrop.open .sheet { transform: none; }
@media (min-width: 700px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: var(--r-xl); padding-bottom: 26px; } .sheet::before { display: none; } }
.sheet-close { position: absolute; top: 12px; right: 12px; z-index: 2; background: rgba(255, 255, 255, .9); }
.sheet-head { margin-bottom: 12px; padding-right: 36px; }
.sheet-head h2 { margin: 6px 0; font-size: 1.6rem; }
.sheet-img { width: calc(100% + 44px); margin: -26px -22px 18px; height: 200px; object-fit: cover; }
.gallery { display: grid; grid-auto-flow: column; grid-auto-columns: 86%; gap: 8px; overflow-x: auto; margin: -6px -6px 16px; scroll-snap-type: x mandatory; }
.gallery img { border-radius: var(--r); aspect-ratio: 4/3; object-fit: cover; width: 100%; scroll-snap-align: center; }
blockquote { margin: 0 0 14px; padding: 12px 16px; border-left: 4px solid var(--turq); background: var(--turq-soft); border-radius: 0 var(--r-s) var(--r-s) 0; font-family: var(--f-display); font-size: 1.1rem; font-style: italic; }
.celebrate { text-align: center; padding: 10px 0; }
.celebrate > .ic { width: 60px; height: 60px; color: var(--terra); margin-bottom: 8px; }

/* ---------- forms ---------- */
.form { display: grid; gap: 14px; }
.form label, .form .field, fieldset { display: grid; gap: 6px; font-size: .85rem; font-weight: 600; color: var(--forest); border: 0; padding: 0; margin: 0; }
legend { font-size: .85rem; font-weight: 600; color: var(--forest); margin-bottom: 6px; padding: 0; }
input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea {
  width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-size: 16px; font-weight: 400; color: var(--ink); transition: border-color .2s, box-shadow .2s;
}
textarea { resize: vertical; min-height: 100px; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--turq); box-shadow: 0 0 0 4px rgba(43, 168, 164, .15); }
.seg { display: grid; grid-auto-flow: column; gap: 4px; background: var(--sand-soft); padding: 4px; border-radius: 999px; }
.seg button { border: 0; background: transparent; min-height: 42px; border-radius: 999px; font-weight: 600; color: var(--forest); }
.seg button.on { background: #fff; box-shadow: var(--shadow-s); }
.stars, .stars-input { display: inline-flex; gap: 2px; }
.stars i { color: rgba(31, 77, 58, .2); display: inline-flex; }
.stars i .ic { width: 15px; height: 15px; }
.stars i.on { color: #E9A23B; }
.stars i.on .ic, .star.on .ic { fill: currentColor; }
.star { border: 0; background: none; padding: 2px; color: rgba(31, 77, 58, .25); transition: transform .15s; }
.star .ic { width: 34px; height: 34px; }
.star.on { color: #E9A23B; }
.star:active { transform: scale(.85); }
.photo-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0, 0, 0, .55); color: #fff; display: grid; place-items: center; padding: 0; }
.ph button .ic { width: 14px; height: 14px; }
.ph.add { border: 2px dashed rgba(31, 77, 58, .25); background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--forest); }

/* ---------- game ---------- */
.game-hero { position: relative; min-height: 300px; display: flex; align-items: flex-end; color: #fff; overflow: hidden; }
.game-hero-inner { position: relative; padding-bottom: 30px; }
.game-hero h1 { color: #fff; margin: 8px 0 6px; }
.game-hero p { color: rgba(255, 255, 255, .88); margin: 0; }
.game-intro { display: grid; gap: 18px; }
@media (min-width: 900px) { .game-intro { grid-template-columns: 1.1fr 1fr; } .game-intro .how { grid-column: 1 / -1; } }
.notebook { position: relative; padding: 26px 24px; border-radius: var(--r-l); background: #F7EEDB; box-shadow: var(--shadow-s), inset 0 0 0 1px rgba(140, 106, 69, .15);
  background-image: repeating-linear-gradient(180deg, transparent 0 31px, rgba(140, 106, 69, .14) 31px 32px); font-family: var(--f-display); font-size: 1.15rem; line-height: 32px; color: #4a3a28; }
.notebook::before { content: ''; position: absolute; left: 18px; top: 0; bottom: 0; width: 2px; background: rgba(217, 119, 75, .35); }
.notebook > * { padding-left: 14px; }
.notebook p { margin: 0; }
.notebook.open { margin: 18px 0; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.how > div { display: flex; flex-direction: column; gap: 2px; padding: 16px; background: #fff; border-radius: var(--r); border: 1px solid var(--line); }
.how .ic { width: 28px; height: 28px; color: var(--turq-deep); margin-bottom: 6px; }
.how small { color: var(--muted); }
.game-step { max-width: 760px; }
.game-bar { display: grid; gap: 12px; margin-bottom: 16px; }
.points { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--sand); border-radius: 99px; color: var(--forest-deep); font-size: .9rem; }
.points .ic { fill: currentColor; width: 16px; height: 16px; }
.seals { display: flex; gap: 6px; justify-content: space-between; }
.seal { flex: 1; aspect-ratio: 1; max-width: 46px; border-radius: 50%; display: grid; place-items: center; background: #fff; border: 2px dashed rgba(31, 77, 58, .25); color: var(--muted); font-weight: 700; font-size: .85rem; transition: all .3s var(--ease); }
.seal.current { border: 2px solid var(--terra); color: var(--terra); transform: scale(1.12); box-shadow: 0 0 0 5px rgba(217, 119, 75, .15); }
.seal.solved { background: var(--forest); border: 2px solid var(--forest); color: var(--sand); }
.seal .ic { width: 16px; height: 16px; }
.step-card { padding: 26px 22px; }
.step-card h2 { margin: 6px 0 10px; }
.step-card .q { font-size: 1.08rem; }
.step-card.unlocked { border-color: var(--turq); }
.shake { animation: shake .45s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.step-img { width: 100%; border-radius: var(--r); aspect-ratio: 3/2; object-fit: cover; margin-bottom: 14px; }
.options { display: grid; gap: 10px; }
.option { display: flex; align-items: center; gap: 12px; padding: 14px; text-align: left; border-radius: var(--r); border: 1.5px solid var(--line); background: #fff; font-weight: 600; transition: all .2s; }
.option span { width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 10px; background: var(--sand-soft); color: var(--forest); }
.option:hover:not(:disabled) { border-color: var(--turq); }
.option.right { border-color: #2C9A5C; background: #E3F3EA; }
.option.right span { background: #2C9A5C; color: #fff; }
.option.wrong { border-color: var(--danger); background: #FBE9E4; opacity: .7; }
.feedback { min-height: 0; margin-top: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.feedback.ok { color: #2C7A4E; } .feedback.bad { color: var(--danger); }
.hint { margin-top: 10px; padding: 12px 14px; background: #FFF6E3; border-radius: var(--r); color: #7a5414; font-size: .92rem; }
.puzzle { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; aspect-ratio: 3/2; border-radius: var(--r); overflow: hidden; background: var(--forest); padding: 3px; }
.tile { border: 0; padding: 0; background-size: calc(var(--n) * 100%) calc(var(--n) * 100%); border-radius: 6px; transition: transform .2s var(--ease), box-shadow .2s, filter .2s; }
.tile.sel { transform: scale(.9); box-shadow: 0 0 0 4px var(--sand); }
.tile.fit { filter: saturate(1.15); }
.puzzle.solved { gap: 0; padding: 0; transition: all .5s; }
.puzzle.solved .tile { border-radius: 0; }
.code-key { background: #F7EEDB; border-radius: var(--r); padding: 14px; }
.key-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
.key-grid span { display: flex; flex-direction: column; align-items: center; padding: 6px 2px; background: rgba(255, 255, 255, .7); border-radius: 10px; }
.key-grid i { font-style: normal; font-size: 1.4rem; line-height: 1.2; }
.key-grid b { font-size: .85rem; color: #4a3a28; }
.carved { display: flex; justify-content: center; gap: 12px; margin: 18px 0; padding: 18px; border-radius: var(--r); background: linear-gradient(145deg, #A9A39A, #8A847B); box-shadow: inset 0 3px 10px rgba(0, 0, 0, .25); }
.carved span { font-size: 2.2rem; filter: grayscale(.4) drop-shadow(0 1px 0 rgba(255, 255, 255, .4)); }
.padlock { max-width: 320px; margin: 0 auto; }
.pad-display { display: flex; justify-content: center; gap: 8px; margin-bottom: 12px; }
.pad-display i { width: 52px; height: 62px; display: grid; place-items: center; font-style: normal; font-size: 1.8rem; font-weight: 700; border-radius: 12px; background: var(--forest-deep); color: var(--sand); }
.pad-display.err i { background: var(--danger); animation: shake .4s; }
.pad-display.open i { background: #2C9A5C; color: #fff; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.keypad button { min-height: 56px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; font-size: 1.3rem; font-weight: 600; color: var(--forest-deep); display: grid; place-items: center; }
.keypad button:active { background: var(--sand-soft); transform: scale(.96); }
.keypad button.ok { background: var(--forest); color: #fff; border-color: var(--forest); }
.loc-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
.loc-ring { --p: 0; width: 170px; height: 170px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 10px 0;
  background: radial-gradient(closest-side, var(--paper) 78%, transparent 80% 100%), conic-gradient(var(--turq) calc(var(--p) * 360deg), rgba(31, 77, 58, .08) 0); }
.loc-ring b { font-family: var(--f-display); font-size: 2rem; color: var(--forest-deep); }
.loc-ring small { color: var(--muted); }
.loc-box .cta-stack { width: 100%; max-width: 340px; }
.seal-broken { margin-top: 18px; padding: 22px; border-radius: var(--r-l); background: linear-gradient(135deg, var(--forest), var(--forest-soft)); color: #fff; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; animation: pop .5s var(--ease); }
.seal-broken > .ic { width: 42px; height: 42px; color: var(--sand); }
.seal-broken b { font-family: var(--f-display); font-size: 1.5rem; }
.seal-broken span { color: var(--sand); font-weight: 700; }
.seal-broken p { margin: 8px 0 0; font-size: .92rem; color: rgba(255, 255, 255, .88); }
.seal-broken .btn { margin-top: 14px; background: var(--sand); color: var(--forest-deep); box-shadow: none; }
@keyframes pop { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: none; } }
.game-finale { max-width: 760px; }
.finale-card { text-align: center; }
.finale-medal { display: flex; justify-content: center; margin-bottom: 10px; }

/* ---------- passport ---------- */
.passport-cover { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 26px 22px; border-radius: var(--r-xl); overflow: hidden; color: #fff;
  background: radial-gradient(circle at 85% 20%, rgba(43, 168, 164, .5), transparent 50%), linear-gradient(135deg, var(--forest-deep), var(--forest)); box-shadow: var(--shadow); }
.passport-cover::after { content: ''; position: absolute; inset: 10px; border: 1.5px dashed rgba(232, 213, 176, .35); border-radius: 26px; pointer-events: none; }
.passport-cover h1 { color: #fff; font-size: clamp(1.6rem, 5vw, 2.4rem); margin: 4px 0; }
.passport-cover small { color: rgba(255, 255, 255, .75); }
.pc-left { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
.pc-emblem { display: none; flex-direction: column; align-items: center; color: var(--sand); text-align: center; font-size: .7rem; letter-spacing: .3em; font-weight: 700; opacity: .9; }
.pc-emblem .ic { width: 56px; height: 56px; margin-bottom: 6px; }
@media (min-width: 640px) { .pc-emblem { display: flex; } }
.avatar { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--sand); font-size: 1.3rem; overflow: hidden; border: 2px solid #fff; box-shadow: var(--shadow-s); }
.avatar.sm { width: 38px; height: 38px; font-size: 1.15rem; }
.avatar.xl { width: 78px; height: 78px; font-size: 2.4rem; border-width: 3px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.stat-tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 14px; }
@media (min-width: 640px) { .stat-tiles { grid-template-columns: repeat(4, 1fr); } }
.tile-stat { padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--r-l); display: flex; flex-direction: column; }
.tile-stat .ic { color: var(--terra); width: 24px; height: 24px; }
.tile-stat b { font-family: var(--f-display); font-size: 2rem; color: var(--forest-deep); line-height: 1.1; margin-top: 6px; }
.tile-stat small { color: var(--muted); }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
.badge-grid.small { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
.badge { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 16px 10px; border-radius: var(--r-l); background: #fff; border: 1px solid var(--line); transition: transform .3s var(--ease); }
.badge:hover { transform: translateY(-3px); }
.badge-medal { position: relative; width: 84px; height: 84px; margin-bottom: 8px; }
.badge-medal svg { width: 100%; height: 100%; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .18)); }
.badge-ic { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; }
.badge-ic .ic { width: 30px; height: 30px; }
.badge b { font-size: .88rem; color: var(--forest-deep); line-height: 1.2; }
.badge small { font-size: .72rem; color: var(--muted); margin-top: 4px; line-height: 1.3; }
.badge.locked .badge-medal { filter: grayscale(1); opacity: .35; }
.badge.earned small { color: #2C7A4E; font-weight: 600; }
.badge.earned .badge-medal { animation: medalIn .7s var(--ease); }
@keyframes medalIn { from { transform: rotate(-20deg) scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
.badge.sm .badge-medal { width: 60px; height: 60px; } .badge.sm .badge-ic .ic { width: 22px; height: 22px; }
.badge.xl { border: 0; background: none; } .badge.xl .badge-medal { width: 130px; height: 130px; } .badge.xl .badge-ic .ic { width: 46px; height: 46px; } .badge.xl small { display: none; }
.stamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; padding: 18px; border-radius: var(--r-l); background: #F7EEDB; }
.stamp { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 14px 8px; border: 2.5px solid var(--terra); border-radius: 50% / 42%; color: var(--terra); text-decoration: none; transform: rotate(var(--r)); background: rgba(255, 255, 255, .35); transition: transform .3s var(--ease); }
.stamp:hover { transform: rotate(0) scale(1.04); }
.stamp-ring .ic { width: 28px; height: 28px; }
.stamp b { font-family: var(--f-display); font-size: .95rem; line-height: 1.15; margin: 4px 0 2px; text-transform: uppercase; letter-spacing: .04em; }
.stamp small { font-size: .7rem; font-weight: 600; }
.timeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.timeline li { display: flex; align-items: center; gap: 12px; padding: 12px 10px 12px 12px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); }
.tl-ic { width: 40px; height: 40px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--turq-soft); color: var(--turq-deep); }
.timeline b { display: block; color: var(--forest-deep); }
.timeline small { color: var(--muted); font-size: .8rem; }
.src-pill { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; background: var(--sand-soft); color: var(--forest); white-space: nowrap; }
.src-pill.gps { background: #E3F3EA; color: #2C7A4E; }
.src-pill.demo { background: #FFF1D6; color: #8C5A12; }
.hl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.hl { position: relative; display: block; border-radius: var(--r-l); overflow: hidden; aspect-ratio: 4/3; color: #fff; text-decoration: none; }
.hl img { width: 100%; height: 100%; object-fit: cover; }
.hl div { position: absolute; inset: auto 0 0; padding: 30px 14px 12px; background: linear-gradient(transparent, rgba(20, 54, 40, .85)); display: flex; flex-direction: column; }
.hl small { color: rgba(255, 255, 255, .85); }

/* ---------- memories ---------- */
.mem-grid { display: grid; gap: 16px; margin-top: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.mem-card { background: var(--paper); border-radius: var(--r-l); overflow: hidden; border: 1px solid var(--line); box-shadow: var(--shadow-s); cursor: pointer; transition: transform .25s var(--ease), box-shadow .25s; }
.mem-card:hover { transform: translateY(-3px) rotate(-.3deg); box-shadow: var(--shadow); }
.mem-media { position: relative; aspect-ratio: 4/3; display: grid; gap: 2px; }
.mem-media.multi { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
.mem-media.multi img:first-child { grid-row: 1 / 3; }
.mem-media img { width: 100%; height: 100%; object-fit: cover; }
.mem-media .more { position: absolute; right: 8px; bottom: 8px; background: rgba(0, 0, 0, .55); color: #fff; padding: 2px 8px; border-radius: 99px; font-size: .78rem; font-weight: 700; }
.mem-body { padding: 14px 16px 16px; }
.mem-body h3 { margin: 8px 0 6px; }
.quote { font-family: var(--f-display); font-style: italic; color: #4a5a52; font-size: .95rem; }

/* ---------- profile & contact ---------- */
.profile-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
.profile-head h1 { margin: 4px 0 0; font-size: 2rem; }
.avatar-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.av-opt { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--line); background: #fff; font-size: 1.5rem; display: grid; place-items: center; padding: 0; overflow: hidden; transition: all .2s; }
.av-opt.on { border-color: var(--turq); box-shadow: 0 0 0 4px rgba(43, 168, 164, .2); transform: scale(1.08); }
.av-opt img { width: 100%; height: 100%; object-fit: cover; }
.av-opt.photo { color: var(--forest); }
.profile-links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
.profile-links a { display: flex; flex-direction: column; align-items: center; padding: 14px 4px; background: #fff; border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--forest); }
.profile-links b { font-family: var(--f-display); font-size: 1.4rem; }
.profile-links small { font-size: .72rem; color: var(--muted); text-align: center; }
.steps-list { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.contact-list { display: grid; gap: 10px; margin: 14px 0; }
.contact-item { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r); background: #fff; border: 1.5px solid var(--line); text-decoration: none; color: var(--ink); transition: all .2s; }
.contact-item:hover { border-color: var(--wa); transform: translateX(3px); }
.contact-item > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
.contact-item small { color: var(--muted); font-size: .82rem; }
.contact-ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: #E3F6EB; color: var(--wa); flex: none; }
.contact-list.big .contact-item { padding: 18px; }
.contact-band { display: grid; gap: 18px; padding: 30px 24px; border-radius: var(--r-xl); color: #fff; background: radial-gradient(circle at 90% 0%, rgba(43, 168, 164, .55), transparent 55%), linear-gradient(135deg, var(--forest-deep), var(--forest)); }
.contact-band h2 { color: #fff; margin: 6px 0; }
.contact-band p { color: rgba(255, 255, 255, .82); margin: 0; }
@media (min-width: 800px) { .contact-band { grid-template-columns: 1.4fr 1fr; align-items: center; padding: 44px; } }

.empty { text-align: center; padding: 34px 18px; border-radius: var(--r-l); border: 2px dashed rgba(31, 77, 58, .15); background: rgba(255, 255, 255, .6); }
.empty-ic { width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; background: var(--sand-soft); color: var(--forest); }
.empty-ic .ic { width: 28px; height: 28px; }
.empty p { color: var(--muted); max-width: 40ch; margin: 0 auto 16px; }

/* ---------- WhatsApp FAB ---------- */
.wa-fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); z-index: 44; width: 56px; height: 56px; border-radius: 50%; background: var(--wa); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 24px rgba(31, 175, 91, .4); transition: transform .2s var(--ease); }
.wa-fab svg { width: 28px; height: 28px; }
.wa-fab:hover { transform: scale(1.08); }
@media (min-width: 900px) { .wa-fab { bottom: 24px; right: 24px; } }

/* ---------- toasts, confetti, splash ---------- */
.toasts { position: fixed; z-index: 2000; left: 50%; transform: translateX(-50%); top: calc(var(--top-h) + var(--safe-t) + 10px); display: grid; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-radius: 14px; background: var(--forest-deep); color: #fff; font-size: .9rem; box-shadow: var(--shadow-l); opacity: 0; transform: translateY(-10px); transition: all .35s var(--ease); }
.toast.show { opacity: 1; transform: none; }
.toast-success { background: #23664A; }
.toast-success .ic { color: var(--sand); }
.toast-error { background: var(--danger); }
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 3000; overflow: hidden; }
.confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { top: 105vh; transform: rotate(720deg) translateX(40px); } }
#splash { position: fixed; inset: 0; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--forest); color: var(--sand); font-family: var(--f-display); font-size: 1.4rem; transition: opacity .5s; }
#splash img { width: 84px; height: 84px; border-radius: 22px; animation: bob 1.4s ease-in-out infinite alternate; }
#splash.gone { opacity: 0; pointer-events: none; }
@keyframes bob { to { transform: translateY(-8px); } }

/* ---- js/core/utils.js ---- */
/* Small helpers shared by all views */
(function () {
  const U = {};

  U.$ = (sel, root = document) => root.querySelector(sel);
  U.$$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

  // Escape user / config text before putting it into HTML templates
  U.esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  U.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // Normalise free-text answers: lowercase, no accents, trimmed
  U.norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();

  // Great-circle distance in metres
  U.haversine = (a, b) => {
    const R = 6371000, toR = d => d * Math.PI / 180;
    const dLat = toR(b[0] - a[0]), dLng = toR(b[1] - a[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a[0])) * Math.cos(toR(b[0])) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };

  /* Route statistics from [[lat,lng,ele?],...]
     time: Naismith-style estimate – 4.5 km/h + 1 h per 600 m ascent */
  U.routeStats = (track) => {
    let dist = 0, gain = 0, loss = 0, hasEle = track.some(p => typeof p[2] === 'number');
    const cum = [0];
    for (let i = 1; i < track.length; i++) {
      dist += U.haversine(track[i - 1], track[i]);
      cum.push(dist);
      if (hasEle) {
        const d = (track[i][2] ?? 0) - (track[i - 1][2] ?? 0);
        if (d > 0) gain += d; else loss -= d;
      }
    }
    const hours = dist / 1000 / 4.5 + gain / 600;
    const eles = hasEle ? track.map(p => p[2]).filter(v => typeof v === 'number') : [];
    return { dist, gain: Math.round(gain), loss: Math.round(loss), hours, cum, hasEle,
      minEle: eles.length ? Math.min(...eles) : null, maxEle: eles.length ? Math.max(...eles) : null };
  };

  // Nearest track index to a position
  U.nearestIndex = (track, pos) => {
    let best = 0, bd = Infinity;
    track.forEach((p, i) => { const d = U.haversine(p, pos); if (d < bd) { bd = d; best = i; } });
    return { index: best, distance: bd };
  };

  U.fmtKm = (m) => (m / 1000).toLocaleString(NA.i18n?.locale() || 'en', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + ' km';
  U.fmtHours = (h) => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60 / 5) * 5; return mm === 60 ? `${hh + 1}h` : `${hh}h${mm ? String(mm).padStart(2, '0') : ''}`; };
  U.fmtDate = (iso) => { try { return new Date(iso).toLocaleDateString(NA.i18n.locale(), { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return iso; } };

  // Toast notifications
  U.toast = (msg, type = 'info', ms = 3200) => {
    let wrap = U.$('#toasts');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.setAttribute('role', 'status');
    el.innerHTML = msg;
    wrap.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 400); }, ms);
  };

  // Simple modal / bottom sheet
  U.sheet = (html, opts = {}) => {
    U.closeSheet();
    const back = document.createElement('div');
    back.className = 'sheet-backdrop';
    back.innerHTML = `<div class="sheet ${opts.wide ? 'sheet-wide' : ''}" role="dialog" aria-modal="true">
      <button class="sheet-close icon-btn" data-close aria-label="${NA.i18n.t('close')}">${NA.icon('x')}</button>${html}</div>`;
    document.body.appendChild(back);
    document.body.classList.add('no-scroll');
    requestAnimationFrame(() => back.classList.add('open'));
    back.addEventListener('click', (e) => { if (e.target === back || e.target.closest('[data-close]')) U.closeSheet(); });
    return back.querySelector('.sheet');
  };
  U.closeSheet = () => {
    const b = U.$('.sheet-backdrop');
    if (!b) return;
    b.classList.remove('open');
    document.body.classList.remove('no-scroll');
    setTimeout(() => b.remove(), 250);
  };

  // Resize an image file to a compressed JPEG data URL (keeps localStorage small)
  U.compressImage = (file, max = 1024, q = 0.72) => new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) return reject(new Error('not-image'));
    const r = new FileReader();
    r.onerror = () => reject(new Error('read'));
    r.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode'));
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', q));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });

  U.confetti = () => {
    const box = document.createElement('div');
    box.className = 'confetti';
    const colors = ['#2BA8A4', '#E8D5B0', '#D9774B', '#1F4D3A', '#F2C14E'];
    for (let i = 0; i < 70; i++) {
      const s = document.createElement('i');
      s.style.left = Math.random() * 100 + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = Math.random() * .6 + 's';
      s.style.animationDuration = 1.8 + Math.random() * 1.4 + 's';
      s.style.transform = `rotate(${Math.random() * 360}deg)`;
      box.appendChild(s);
    }
    document.body.appendChild(box);
    setTimeout(() => box.remove(), 3800);
  };

  U.download = (filename, text, mime = 'application/gpx+xml') => {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  NA.u = U;
})();

/* ---- js/core/i18n.js ---- */
/* i18n core. UI strings live in js/i18n/strings.js; content in config files
   uses {en, nl, es} objects that are read with NA.i18n.L(obj). */
(function () {
  const SUPPORTED = ['en', 'nl', 'es'];
  const LOCALES = { en: 'en-GB', nl: 'nl-NL', es: 'es-ES' };

  const i18n = {
    lang: 'en',
    supported: SUPPORTED,
    names: { en: 'English', nl: 'Nederlands', es: 'Español' },
    init(saved) {
      if (saved && SUPPORTED.includes(saved)) this.lang = saved;
      else {
        const nav = (navigator.language || 'en').slice(0, 2);
        this.lang = SUPPORTED.includes(nav) ? nav : 'en'; // English is the default
      }
      document.documentElement.lang = this.lang;
    },
    set(lang) {
      if (!SUPPORTED.includes(lang)) return;
      this.lang = lang;
      document.documentElement.lang = lang;
      NA.store.mutate(s => { s.lang = lang; });
    },
    locale() { return LOCALES[this.lang]; },
    t(key, vars) {
      const dict = NA.strings[this.lang] || {};
      let s = dict[key] ?? NA.strings.en[key];
      if (s == null) { console.warn('[i18n] missing', key); s = key; }
      if (vars) Object.keys(vars).forEach(k => { s = s.split(`{${k}}`).join(vars[k]); });
      return s;
    },
    // Localised value from a config object {en, nl, es}
    L(obj) {
      if (obj == null) return '';
      if (typeof obj === 'string') return obj;
      return obj[this.lang] ?? obj.en ?? '';
    }
  };
  NA.i18n = i18n;
})();

/* ---- js/services/store.js ---- */
/* ==========================================================================
   DATA LAYER
   All reads/writes go through NA.store. The actual persistence is done by an
   ADAPTER. Today: LocalAdapter (localStorage, this device only).
   Later: write a RemoteAdapter (e.g. Supabase) with the same load/save API
   and switch NA.store.adapter – the views do not need to change.
   ========================================================================== */
(function () {
  const KEY = 'aventura-experience:v1';

  const defaults = () => ({
    version: 1,
    lang: null,
    profile: { name: '', avatar: { type: 'emoji', value: '🧭' }, favorites: [] },
    adventures: [],      // {id, kind:'route'|'tour'|'game', refId, title, date, km, gain, source:'gps'|'manual'|'demo', tourType}
    visits: {},          // placeId -> {date, verified}
    memories: [],        // {id, title, tour, date, highlight, rating, review, photos[], createdAt}
    game: null,          // see views/play.js
    importedRoutes: [],  // GPX imports {id, name, track, pois, importedAt}
    earnedBadges: {}     // badgeId -> ISO date
  });

  const LocalAdapter = {
    name: 'local',
    load() {
      try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
      catch (e) { console.warn('localStorage unavailable', e); return null; }
    },
    save(state) {
      try { localStorage.setItem(KEY, JSON.stringify(state)); return { ok: true }; }
      catch (e) { return { ok: false, error: (e && e.name === 'QuotaExceededError') ? 'quota' : 'unavailable' }; }
    },
    clear() { try { localStorage.removeItem(KEY); } catch (e) { } }
  };

  /* Placeholder for a future backend. Intentionally NOT active.
     See README.md → "Backend koppelen". */
  const RemoteAdapter = {
    name: 'remote',
    load() { throw new Error('RemoteAdapter not configured'); },
    save() { throw new Error('RemoteAdapter not configured'); }
  };

  const listeners = new Set();
  let state;

  const store = {
    adapter: LocalAdapter,
    RemoteAdapter,
    init() {
      state = Object.assign(defaults(), this.adapter.load() || {});
      state.profile = Object.assign(defaults().profile, state.profile || {});
    },
    get() { return state; },
    /* mutate(fn): change state, persist, re-evaluate badges, notify */
    mutate(fn, { silent = false } = {}) {
      fn(state);
      const newly = this.evaluateBadges();
      const res = this.adapter.save(state);
      if (!res.ok) {
        NA.u.toast(NA.i18n.t(res.error === 'quota' ? 'err.quota' : 'err.storage'), 'error', 6000);
      }
      if (!silent) listeners.forEach(l => l(state));
      newly.forEach((b, i) => setTimeout(() => NA.u.toast(`${NA.icon('trophy')} ${NA.i18n.t('badge.unlocked')}: <b>${NA.u.esc(NA.i18n.L(b.name))}</b>`, 'success', 4500), 400 + i * 700));
      if (newly.length) NA.u.confetti();
      return res.ok;
    },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    stats() {
      const s = state;
      const st = {
        adventures: s.adventures,
        visits: s.visits,
        memories: s.memories,
        km: s.adventures.reduce((a, x) => a + (x.source === 'demo' ? 0 : (+x.km || 0)), 0),
        gain: s.adventures.reduce((a, x) => a + (x.source === 'demo' ? 0 : (+x.gain || 0)), 0),
        gameDone: !!(s.game && s.game.done),
        familyDone: s.adventures.some(a => a.kind === 'game' && a.mode === 'family'),
        tourTypes: new Set(s.adventures.map(a => a.tourType).filter(Boolean)),
        routeIds: new Set(s.adventures.filter(a => a.kind === 'route').map(a => a.refId)),
        badgeCount: 0
      };
      st.badgeCount = NA.badges.filter(b => b.id !== 'master' && b.rule(st)).length;
      return st;
    },

    evaluateBadges() {
      const st = this.stats();
      const newly = [];
      NA.badges.forEach(b => {
        if (!state.earnedBadges[b.id] && b.rule(st)) { state.earnedBadges[b.id] = new Date().toISOString(); newly.push(b); }
      });
      return newly;
    },

    addAdventure(a) {
      return this.mutate(s => s.adventures.unshift(Object.assign({ id: NA.u.uid(), date: new Date().toISOString() }, a)));
    },

    exportJSON() { return JSON.stringify(state, null, 2); },
    reset() { this.adapter.clear(); state = defaults(); state.lang = NA.i18n.lang; this.adapter.save(state); listeners.forEach(l => l(state)); },

    // Rough size of stored data in KB (for the profile page)
    sizeKB() { try { return Math.round((localStorage.getItem(KEY) || '').length / 1024); } catch (e) { return 0; } }
  };

  NA.store = store;
})();

/* WhatsApp contact links – uses the existing WhatsApp channel from the website.
   No bookings or payments happen in the app: every request opens WhatsApp
   with a pre-filled message that the user still sends themselves. */
(function () {
  const C = {};
  C.wa = (text) => `https://wa.me/${NA.brand.whatsapp}?text=${encodeURIComponent(text)}`;
  C.shareWa = (text) => `https://wa.me/?text=${encodeURIComponent(text)}`;

  // Pre-filled request types (texts in i18n: contact.msg.*)
  C.types = ['info', 'custom', 'group', 'route'];

  C.message = (type, extra = '') => {

    const name = NA.store.get().profile.name;
    let msg = t('contact.msg.' + type);
    if (extra) msg += '\n' + extra;
    if (name) msg += '\n— ' + name;
    return msg;

  C.link = (type, extra) => C.wa(C.message(type, extra));

  // Opens the contact sheet with the four request types
  C.openSheet = (context = '') => {
    const t = NA.i18n.t, icon = NA.icon;

      <p class="muted">${t('contact.lead')}</p></div>

      </div>

  NA.contact = C;
})();

/* ---- js/services/map.js ---- */
/* Leaflet + OpenStreetMap helpers, GPS and GPX import/export */
(function () {
  const M = {};

  M.available = () => typeof window.L !== 'undefined';

  // Creates a map in `el`, or shows a friendly error when Leaflet/tiles are unavailable
  M.create = (el, opts = {}) => {
    if (!M.available()) {
      el.classList.add('map-error');
      el.innerHTML = `<div class="map-error-box">${NA.icon('map')}<b>${NA.i18n.t('map.unavailable')}</b><span>${NA.i18n.t('map.unavailable.sub')}</span></div>`;
      return null;
    }
    const map = L.map(el, { zoomControl: false, scrollWheelZoom: opts.scrollWheel ?? false, tap: true, attributionControl: true });
    L.control.zoom({ position: 'topright' }).addTo(map);
    const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
    }).addTo(map);
    let warned = false;
    tiles.on('tileerror', () => {
      if (!warned && !navigator.onLine) { warned = true; NA.u.toast(NA.i18n.t('map.offline'), 'error', 5000); }
    });
    setTimeout(() => map.invalidateSize(), 200);
    return map;
  };

  M.divIcon = (cls, html = '', size = 34) => L.divIcon({ className: 'mk ' + cls, html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });

  /* ---------------- GPS ---------------- */
  M.gpsSupported = () => 'geolocation' in navigator;

  M.gpsErrorText = (err) => {
    const t = NA.i18n.t;
    if (!M.gpsSupported()) return t('gps.unsupported');
    if (!window.isSecureContext) return t('gps.insecure');
    if (!err) return t('gps.error');
    if (err.code === 1) return t('gps.denied');
    if (err.code === 2) return t('gps.unavailable');
    if (err.code === 3) return t('gps.timeout');
    return t('gps.error');
  };

  // Watch position; returns stop function. Only reports a position after the
  // user granted permission (browser prompt).
  M.watch = (onPos, onErr) => {
    if (!M.gpsSupported()) { onErr && onErr(null); return () => { }; }
    const id = navigator.geolocation.watchPosition(
      p => onPos({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, ts: p.timestamp }),
      e => onErr && onErr(e),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  };

  /* ---------------- External navigation ---------------- */
  M.googleUrl = (lat, lng) => `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}&travelmode=driving`;
  M.appleUrl = (lat, lng, name = '') => `https://maps.apple.com/?daddr=${lat},${lng}&q=${encodeURIComponent(name)}`;
  M.osmUrl = (lat, lng) => `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=15/${lat}/${lng}`;

  /* ---------------- GPX ---------------- */
  M.parseGPX = (text) => {
    const doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.querySelector('parsererror')) throw new Error('gpx-invalid');
    const pick = (sel) => Array.from(doc.getElementsByTagName(sel));
    let pts = pick('trkpt');
    if (!pts.length) pts = pick('rtept');
    if (pts.length < 2) throw new Error('gpx-empty');
    let track = pts.map(p => {
      const ele = p.getElementsByTagName('ele')[0];
      const e = ele ? parseFloat(ele.textContent) : undefined;
      return [parseFloat(p.getAttribute('lat')), parseFloat(p.getAttribute('lon')), isNaN(e) ? undefined : Math.round(e)];
    }).filter(p => !isNaN(p[0]) && !isNaN(p[1]));
    // Simplify very long tracks so they fit in localStorage
    const MAX = 2500;
    if (track.length > MAX) {
      const step = track.length / MAX;
      const out = [];
      for (let i = 0; i < MAX; i++) out.push(track[Math.floor(i * step)]);
      out.push(track[track.length - 1]);
      track = out;
    }
    const nameEl = doc.querySelector('metadata > name') || doc.querySelector('trk > name') || doc.querySelector('rte > name');
    const wpts = pick('wpt').slice(0, 30).map(w => ({
      pos: [parseFloat(w.getAttribute('lat')), parseFloat(w.getAttribute('lon'))],
      name: (w.getElementsByTagName('name')[0] || {}).textContent || 'Waypoint',
      desc: (w.getElementsByTagName('desc')[0] || {}).textContent || ''
    })).filter(w => !isNaN(w.pos[0]));
    return { name: nameEl ? nameEl.textContent.trim() : '', track, wpts };
  };

  M.toGPX = (name, track) => {
    const esc = NA.u.esc;
    return `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Aventura Experience" xmlns="http://www.topografix.com/GPX/1/1">
<metadata><name>${esc(name)}</name></metadata>
<trk><name>${esc(name)}</name><trkseg>
${track.map(p => `<trkpt lat="${p[0]}" lon="${p[1]}">${typeof p[2] === 'number' ? `<ele>${p[2]}</ele>` : ''}</trkpt>`).join('\n')}
</trkseg></trk></gpx>`;
  };

  /* Elevation profile as inline SVG; `progress` 0..1 shades the walked part */
  M.profileSVG = (track, stats, progress = 0) => {
    if (!stats.hasEle) return `<div class="profile-empty">${NA.i18n.t('route.noEle')}</div>`;
    const W = 600, H = 120, pad = 6;
    const min = stats.minEle, max = Math.max(stats.maxEle, min + 10);
    const total = stats.dist || 1;
    const pts = track.map((p, i) => [pad + (stats.cum[i] / total) * (W - 2 * pad), H - pad - ((p[2] ?? min) - min) / (max - min) * (H - 2 * pad - 10)]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const area = `${line} L${W - pad},${H} L${pad},${H} Z`;
    const px = pad + progress * (W - 2 * pad);
    return `<svg class="profile" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${NA.i18n.t('route.profile')}">
      <defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2BA8A4" stop-opacity=".45"/><stop offset="1" stop-color="#2BA8A4" stop-opacity="0"/></linearGradient>
      <clipPath id="pc"><rect x="0" y="0" width="${px}" height="${H}"/></clipPath></defs>
      <path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#1F4D3A" stroke-width="2" vector-effect="non-scaling-stroke"/>
      ${progress > 0 ? `<path d="${area}" fill="#D9774B" opacity=".25" clip-path="url(#pc)"/><line x1="${px}" x2="${px}" y1="0" y2="${H}" stroke="#D9774B" stroke-width="2" vector-effect="non-scaling-stroke"/>` : ''}
    </svg><div class="profile-axis"><span>${min} m</span><span>${stats.maxEle} m</span></div>`;
  };

  NA.map = M;
})();
