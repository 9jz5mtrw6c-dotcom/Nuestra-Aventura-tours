          const url = await NA.u.compressImage(avInput.files[0], 256, .8);
          avatar = { type: 'image', value: url };
          const b = root.querySelector('[data-photo]'); b.innerHTML = `<img src="${url}" alt="">`;
          root.querySelectorAll('.av-opt').forEach(x => x.classList.toggle('on', x === b));
        } catch (e) { NA.u.toast(t('mem.photoErr'), 'error'); }
      };
      root.querySelector('#profileForm').onsubmit = (e) => {
        e.preventDefault();
        const name = new FormData(e.target).get('name').trim().slice(0, 40);
        NA.store.mutate(s => { s.profile.name = name; s.profile.avatar = avatar; });
        NA.u.toast(t('profile.saved'), 'success');
      };
      root.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { NA.i18n.set(b.dataset.lang); NA.app.render(); });
      root.querySelector('[data-export]').onclick = () => NA.u.download('aventura-experience-data.json', NA.store.exportJSON(), 'application/json');
      root.querySelector('[data-reset]').onclick = () => {
        NA.u.sheet(`<div class="sheet-head"><h2>${t('profile.reset')}?</h2><p class="muted">${t('profile.resetText')}</p></div>
          <div class="cta-stack"><button class="btn btn-danger" data-yes>${icon('trash')} ${t('profile.reset')}</button><button class="btn btn-text" data-close>${t('cancel')}</button></div>`)
          .querySelector('[data-yes]').onclick = () => { NA.store.reset(); NA.u.closeSheet(); NA.u.toast(t('profile.resetDone')); NA.app.render(); };
      };
    }
  };

  NA.views.contact = {
    title: () => t('contact.title'),
    render() {
      const items = [['info', 'info'], ['custom', 'sparkles'], ['group', 'users'], ['route', 'route']];
      return `
      <section class="page-hero small"><img src="${NA.photos.hiker}" alt=""><div class="hero-shade"></div>
        <div class="wrap page-hero-inner"><span class="eyebrow light">${t('contact.eyebrow')}</span><h1>${t('contact.title')}</h1><p>${t('contact.lead')}</p></div></section>
      <section class="wrap section narrow">
        <div class="contact-list big">${items.map(([k, ic]) => `<a class="contact-item" target="_blank" rel="noopener" href="${NA.contact.link(k)}">
          <span class="contact-ic">${icon(ic)}</span><span><b>${t('contact.type.' + k)}</b><small>${t('contact.type.' + k + '.sub')}</small></span>${icon('chevronR')}</a>`).join('')}</div>
        <div class="card soft"><p>${icon('info')} ${t('contact.noBooking')}</p></div>
        <p class="fine">${icon('whatsapp')} WhatsApp ${NA.brand.whatsappDisplay}</p>
        <div class="row gap-s wrap"><a class="chip" href="${NA.brand.instagram}" target="_blank" rel="noopener">Instagram</a>
          <a class="chip" href="${NA.brand.facebook}" target="_blank" rel="noopener">Facebook</a>
          <a class="chip" href="${NA.brand.pages.about}" target="_blank" rel="noopener">${t('contact.about')}</a>
          <a class="chip" href="${NA.brand.pages.holiday}" target="_blank" rel="noopener">${t('contact.holiday')}</a></div>
      </section>`;
    }
  };

  NA.views.contactBand = () => `
    <section class="wrap section">
      <div class="contact-band">
        <div><span class="eyebrow light">${t('contact.eyebrow')}</span><h2>${t('band.title')}</h2><p>${t('band.text')}</p></div>
        <div class="row gap-s wrap"><a class="btn btn-wa btn-lg" target="_blank" rel="noopener" href="${NA.contact.link('custom')}">${icon('whatsapp')} ${t('band.cta')}</a>
        <a class="btn btn-glass" href="#/contact">${t('band.more')}</a></div>
      </div>
    </section>`;

  NA.views.notFound = () => `<section class="wrap section">${NA.ui.empty('compass', t('nf.title'), t('nf.text'), `<a class="btn btn-primary" href="#/discover">${t('nav.discover')}</a>`)}</section>`;
})();

/* ---- js/app.js ---- */
/* App shell: router, navigation, language switch, PWA registration */
(function () {
  const t = (...a) => NA.i18n.t(...a), icon = (n, c) => NA.icon(n, c);
  const NAV = [
    { id: 'discover', icon: 'compass' },
    { id: 'explore', icon: 'map' },
    { id: 'play', icon: 'puzzle' },
    { id: 'passport', icon: 'passport' },
    { id: 'memories', icon: 'camera' }
  ];
  const SECTION = { tour: 'discover', route: 'explore', hidden: 'explore' };
  const AUTO = new Set(['passport', 'memories', 'profile']);

  let current = { name: null, params: {} }, cleanup = null;

  function parse() {
    const raw = (location.hash || '#/discover').slice(1);
    const [path, qs] = raw.split('?');
    const parts = path.split('/').filter(Boolean);
    const query = Object.fromEntries(new URLSearchParams(qs || ''));
    let name = parts[0] || 'discover';
    if (!NA.views[name] || typeof NA.views[name] !== 'object') name = 'notfound';
    return { name, params: { id: parts[1] ? decodeURIComponent(parts[1]) : null, query } };
  }

  function shell() {
    const s = NA.store.get();
    document.getElementById('desktopNav').innerHTML = NAV.map(n => `<a href="#/${n.id}" data-nav="${n.id}">${icon(n.icon)}<span>${t('nav.' + n.id)}</span></a>`).join('');
    document.getElementById('bottomNav').innerHTML = NAV.map(n => `<a href="#/${n.id}" data-nav="${n.id}">${icon(n.icon)}<span>${t('nav.' + n.id)}</span></a>`).join('');
    const sel = document.getElementById('langSelect');
    sel.innerHTML = NA.i18n.supported.map(l => `<option value="${l}" ${l === NA.i18n.lang ? 'selected' : ''}>${l.toUpperCase()}</option>`).join('');
    sel.setAttribute('aria-label', t('lang.label'));
    document.getElementById('profileBtn').innerHTML = NA.views.avatarHTML(s.profile.avatar, 'sm');
    document.getElementById('profileBtn').setAttribute('aria-label', t('profile.title'));
    document.getElementById('waFab').href = NA.contact.link('info');
    document.getElementById('waFab').setAttribute('aria-label', t('contact.title'));
    document.getElementById('skipLink').textContent = t('skip');
    document.getElementById('offline').textContent = t('offline');
    markNav();
  }

  function markNav() {
    const sec = SECTION[current.name] || current.name;
    document.querySelectorAll('[data-nav]').forEach(a => {
      const on = a.dataset.nav === sec;
      a.classList.toggle('active', on);
      on ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current');
    });
  }

  function render(opts = {}) {
    const main = document.getElementById('view');
    if (cleanup) { try { cleanup(); } catch (e) { console.warn(e); } cleanup = null; }
    const v = current.name === 'notfound' ? null : NA.views[current.name];
    const y = window.scrollY;
    try {
      main.innerHTML = v ? v.render(current.params) : NA.views.notFound();
      main.classList.remove('enter'); void main.offsetWidth; if (!opts.keepScroll) main.classList.add('enter');
      if (v && v.mount) cleanup = v.mount(main, current.params) || null;
    } catch (e) {
      console.error(e);
      main.innerHTML = `<section class="wrap section">${NA.ui.empty('info', t('err.view'), NA.u.esc(e.message))}</section>`;
    }
    const title = v && v.title ? v.title(current.params) : '';
    document.title = (title ? title + ' · ' : '') + 'Aventura Experience';
    shell();
    if (opts.keepScroll) window.scrollTo(0, y);
  }

  function route() {
    current = parse();
    NA.u.closeSheet();
    render();
    window.scrollTo(0, 0);
    // Move focus to main content for screen readers
    const h = document.querySelector('#view h1, #view h2');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }

  function offlineBanner() {
    const b = document.getElementById('offline');
    const upd = () => { b.hidden = navigator.onLine; };
    window.addEventListener('online', upd); window.addEventListener('offline', upd); upd();
  }

  NA.app = {
    render: () => render({ keepScroll: true }),
    init() {
      NA.store.init();
      NA.i18n.init(NA.store.get().lang);
      document.getElementById('langSelect').onchange = (e) => { NA.i18n.set(e.target.value); render({ keepScroll: true }); };
      // Re-render data-driven pages when data changes (not map/game pages, to keep their live state)
      NA.store.on(() => { if (AUTO.has(current.name)) render({ keepScroll: true }); else shell(); });
      window.addEventListener('hashchange', route);
      offlineBanner();
      route();
      document.getElementById('splash')?.classList.add('gone');
      setTimeout(() => document.getElementById('splash')?.remove(), 700);

      // PWA: register service worker (only works over http(s), not file://)
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        Promise.resolve() /* single-file: no SW */.catch(e => console.warn('SW', e));
      }
    }
  };

  document.addEventListener('DOMContentLoaded', () => NA.app.init());
})();

</script>
